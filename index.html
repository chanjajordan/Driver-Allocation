const Dist = {
  factor(){ return Number(S.settings.roadFactor)||1.35; },   // straight line -> road distance
  /* find a point for a free-text Singapore address */
  locate(text){
    const t=' '+String(text||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ')+' ';
    if(!t.trim()) return null;
    let best=null, bestLen=0;
    SGPLACES.forEach(pl=>{
      const n=' '+pl[0].toLowerCase()+' ';
      if(t.indexOf(n)>=0 && pl[0].length>bestLen){ best={lat:pl[1], lon:pl[2], how:pl[0]}; bestLen=pl[0].length; }
    });
    if(best) return best;
    const pc=String(text||'').match(/\b(\d{6})\b/);
    if(pc){ const sec=SGSECTORS[pc[1].slice(0,2)];
      if(sec) return {lat:sec[0], lon:sec[1], how:'postal sector '+pc[1].slice(0,2)}; }
    return null;
  },
  haversine(a,b){
    const R=6371, rad=x=>x*Math.PI/180;
    const dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
    const h=Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
  },
  /* one leg, collection -> delivery */
  estimate(from, to){
    const a=this.locate(from), b=this.locate(to);
    if(!a || !b) return {km:null, why: !a&&!b? 'neither address recognised' : (!a? 'collection address not recognised':'delivery address not recognised')};
    const straight=this.haversine(a,b);
    const km = Math.max(straight<0.5? 3 : straight*this.factor(), 1);   // a drop inside one area is still a trip
    return {km: Math.round(km*10)/10, straight:Math.round(straight*10)/10,
      why: a.how===b.how? 'within '+a.how : a.how+' → '+b.how, from:a, to:b};
  },
  /* what a job counts for: the figure keyed in wins, otherwise the estimate */
  jobKm(j){
    if(j && j.km!=null && j.km!=='' && !isNaN(Number(j.km))) return {km:Number(j.km), actual:true};
    const e=this.estimate(j&&j.pickup, (j&&j.dropoff)||(j&&j.address));
    return {km:e.km, actual:false, why:e.why, straight:e.straight};
  },
  /* jobs are assigned to a driver; the driver has a lorry on that date */
  vehicleOfJob(j){
    if(!j || !j.assigned || !j.date) return null;
    return Fleet.vehicleFor(j.date, j.assigned);
  },
  /* logged distance per lorry between two dates */
  byVehicle(fromISO, toISO){
    const out={};
    Object.values(S.jobs||{}).forEach(j=>{
      if(!j.date || j.date<fromISO || j.date>toISO) return;
      const vid=this.vehicleOfJob(j); if(!vid) return;
      const k=this.jobKm(j); if(k.km==null) return;
      const row=out[vid]=out[vid]||{vid, km:0, jobs:0, actual:0, estimated:0, unknown:0};
      row.km+=k.km; row.jobs++; k.actual? row.actual++ : row.estimated++;
    });
    return out;
  },
  unattributed(fromISO,toISO){
    let noDriver=0, noAddress=0;
    Object.values(S.jobs||{}).forEach(j=>{
      if(!j.date || j.date<fromISO || j.date>toISO) return;
      if(!this.vehicleOfJob(j)){ noDriver++; return; }
      if(this.jobKm(j).km==null) noAddress++;
    });
    return {noDriver, noAddress};
  }
};

/* ------------------------- pay & overtime cost ----------------------
   Singapore Employment Act, Part 4 (workmen up to $4,500 basic, non-workmen
   up to $2,600). Hourly basic rate for a monthly-rated employee is
   12 x monthly basic / (52 x 44). Overtime is at least 1.5x that rate,
   capped at 72 OT hours a month. Work on a rest day at the employer's
   request pays 1 day's salary for half the normal daily hours or less,
   2 days' salary for more, plus overtime for anything beyond the normal
   daily hours.  https://www.mom.gov.sg/employment-practices/hours-of-work-overtime-and-rest-days
------------------------------------------------------------------- */
const Pay = {
  cur(){ return S.settings.currency || 'S$'; },
  money(n){ return this.cur()+(Math.round((Number(n)||0)*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); },
  basic(d){ return Number(d && d.basicPay) || 0; },
  /* hourly basic rate */
  hourly(d){
    if(!d) return 0;
    if(d.payType==='hourly') return this.basic(d);
    const wk=S.settings.maxWeeklyHours||44, yr=S.settings.weeksPerYear||52;
    return (12*this.basic(d))/(yr*wk);
  },
  /* one day's salary */
  daily(d){
    if(!d) return 0;
    if(d.payType==='hourly') return this.basic(d)*(S.settings.normalDailyHours||8);
    const wd=S.settings.workDaysPerWeek||6, yr=S.settings.weeksPerYear||52;
    return (12*this.basic(d))/(yr*wd);
  },
  otRate(d){ return this.hourly(d)*(Number(S.settings.otMultiplier)||1.5); },
  /* is this driver covered by Part 4 — i.e. legally entitled to OT pay? */
  covered(d){
    if(!d) return false;
    if(d.otEligible==='no') return false;
    if(d.otEligible==='yes') return true;
    const cap = (d.role==='nonworkman')? (S.settings.nonWorkmanSalaryCap||2600) : (S.settings.workmanSalaryCap||4500);
    const monthly = d.payType==='hourly' ? this.hourly(d)*(S.settings.maxWeeklyHours||44)*52/12 : this.basic(d);
    return monthly>0 && monthly<=cap;
  },
  /* was this a rest day actually given up, or just swapped for another day? */
  restDayWorked(date, did){
    const e=entry(date,did);
    if(!e || (e.t!=='D' && e.t!=='S')) return null;
    if(!e.creditFromOff && !e.cover) return null;
    if(!e.creditFromOff) return null;                 // only counts if he was scheduled off
    if(e.settled && e.settledOn){
      // the rest day was handed back — a swap, not a rest day surrendered
      return {swapped:true, settledOn:e.settledOn, sameWeek: weekStartOf(e.settledOn)===weekStartOf(date)};
    }
    return {swapped:false};
  },
  /* full month for one driver */
  month(did, ym){
    const d=S.drivers[did]||null;
    const days=monthDays(ym.y, ym.m);
    const out={ driver:d, ordinaryHours:0, restDayShifts:[], restDayPay:0, otHours:0, otPay:0,
      totalHours:0, extraCost:0, flags:[], covered:this.covered(d), hourly:this.hourly(d), daily:this.daily(d) };
    if(!d) return out;
    const nd=S.settings.normalDailyHours||8, wk=S.settings.maxWeeklyHours||44;
    const weekOrdinary={};
    days.forEach(date=>{
      const e=entry(date,did); if(!e||(e.t!=='D'&&e.t!=='S')) return;
      const hrs=shiftHours(e.shift); out.totalHours+=hrs;
      const rd=this.restDayWorked(date,did);
      if(rd && !rd.swapped){
        // paid under the rest-day rules, so it stays out of the weekly ordinary-hours count
        const full = hrs > nd/2;
        const daysPay = (S.settings.restDayAtEmployerRequest!==false) ? (full?2:1) : (full?1:0.5);
        const excess = Math.max(0, hrs-nd);
        const pay = daysPay*this.daily(d) + excess*this.otRate(d);
        out.restDayShifts.push({date, hrs, daysPay, excess, pay, shift:e.shift});
        out.restDayPay += pay;
      } else {
        const ws=weekStartOf(date);
        weekOrdinary[ws]=(weekOrdinary[ws]||0)+hrs;
        out.ordinaryHours+=hrs;
      }
    });
    Object.keys(weekOrdinary).forEach(ws=>{ out.otHours += Math.max(0, weekOrdinary[ws]-wk); });
    out.otHours=Math.round(out.otHours*100)/100;
    out.otPay = out.otHours*this.otRate(d);
    out.extraCost = out.otPay + out.restDayPay;
    const cap=S.settings.maxMonthlyOT||72;
    if(out.otHours>cap) out.flags.push('Over the '+cap+'h monthly overtime cap');
    if(!out.covered && this.basic(d)>0) out.flags.push('Above the Part 4 salary cap — overtime pay is contractual, not statutory');
    if(this.basic(d)<=0) out.flags.push('No basic pay recorded');
    return out;
  },
  fleetMonth(ym){
    const rows=activeDrivers().map(d=>Object.assign({did:d.id}, this.month(d.id,ym)));
    const t={otHours:0, otPay:0, restDayPay:0, extraCost:0, restDays:0, drivers:rows.length};
    rows.forEach(r=>{ t.otHours+=r.otHours; t.otPay+=r.otPay; t.restDayPay+=r.restDayPay;
      t.extraCost+=r.extraCost; t.restDays+=r.restDayShifts.length; });
    return {rows, total:t};
  },
  /* what one extra shift would cost — used when ranking cover candidates */
  costOfShift(did, date, shiftId){
    const d=S.drivers[did]; if(!d) return {cost:0, why:'no driver'};
    const hrs=shiftHours(shiftId), nd=S.settings.normalDailyHours||8, wk=S.settings.maxWeeklyHours||44;
    const e=entry(date,did), t=e?e.t:'_';
    if(t==='D'||t==='S') return {cost:0, why:'already rostered — no extra pay'};
    if(t==='O'){
      const full=hrs>nd/2;
      const daysPay=(S.settings.restDayAtEmployerRequest!==false)?(full?2:1):(full?1:0.5);
      const excess=Math.max(0,hrs-nd);
      return {cost: daysPay*this.daily(d)+excess*this.otRate(d),
              swapCost: Math.max(0, (this.weekAfter(did,date,hrs)-wk))*this.otRate(d),
              restDay:true, daysPay,
              why: daysPay+(daysPay===1?' day\'s':' days\'')+' salary for working a rest day'};
    }
    const after=this.weekAfter(did,date,hrs);
    const ot=Math.max(0, after-wk) - Math.max(0, after-hrs-wk);
    return {cost: ot*this.otRate(d), otHours:Math.round(ot*100)/100,
            why: ot>0? ot.toFixed(1)+'h of overtime' : 'inside normal hours — no extra pay'};
  },
  weekAfter(did,date,addHrs){ return Rules.weekHours(did,date)+addHrs; }
};

/* ----------------------------- actions ------------------------------ */
const Act = {
  setEntry(date,did,patch){
    const cur = entry(date,did) || {};
    const next = Object.assign({}, cur, patch);
    Object.keys(next).forEach(k=>{ if(next[k]===null||next[k]===undefined||next[k]==='') delete next[k]; });
    if(!next.t || next.t==='_') DB.put('roster/'+date+'/'+did, null);
    else DB.put('roster/'+date+'/'+did, next);
  },
  clearEntry(date,did){ DB.put('roster/'+date+'/'+did, null); },

  /* assign a replacement for an MC/absent driver. Credits an off day if the
     replacement was scheduled off that day. */
  assignCover(date, shiftId, coverDid, forDid){
    const was = code(date,coverDid);
    const e = { t:'D', shift:shiftId, cover:forDid };
    if(was==='O') e.creditFromOff = true;
    /* hand over the absent driver's lorry if it is still roadworthy, else find a free one */
    const theirs = Fleet.vehicleFor(date, forDid);
    if(theirs && !Fleet.downOn(theirs, date) && Fleet.fits(Fleet.byId(theirs), shiftById(shiftId))) e.veh = theirs;
    else { const v = Fleet.pickFor(date, shiftId, coverDid); if(v) e.veh = v.id; }
    DB.put('roster/'+date+'/'+coverDid, e);
    Render.all();
    toast((S.drivers[coverDid].name)+' covering '+(S.drivers[forDid]?S.drivers[forDid].name:'shift')+
      (was==='O'? ' — off day banked':''));
  },
  /* Give the replacement the absent driver's next scheduled off day (a straight swap). */
  swapOffDay(coverDid, forDid, fromDate){
    /* Prefer a swap inside the same pay week — that keeps the replacement's weekly
       hours flat and turns the callout into a straight day swap with no overtime. */
    const ws=weekStartOf(fromDate), cands=[];
    for(let i=1;i<=60;i++){
      const d=addDays(fromDate,i);
      const eA=entry(d,coverDid), eB=entry(d,forDid);
      if(!(eB && eB.t==='O')) continue;                       // absent driver must be off that day
      if(!(eA && (eA.t==='D'||eA.t==='S') && !eA.cover)) continue;   // replacement must be working
      cands.push({d, eA, eB, sameWeek: weekStartOf(d)===ws, i});
    }
    if(!cands.length){ toast('No swappable off day in the next 60 days — set one manually from Cover & Credits'); return null; }
    cands.sort((a,b)=> (b.sameWeek-a.sameWeek) || (a.i-b.i));
    const {d,eA}=cands[0];
    DB.putMany([
      ['roster/'+d+'/'+coverDid, {t:'O', comp:true, compFor:forDid, note:'Comp off for '+fromDate}],
      ['roster/'+d+'/'+forDid,   {t:eA.t, shift:eA.shift, swapFrom:coverDid, note:'Swapped off day from '+fromDate}]
    ]);
    const orig = entry(fromDate, coverDid);
    if(orig && orig.cover===forDid) DB.put('roster/'+fromDate+'/'+coverDid, Object.assign({},orig,{settled:true, settledOn:d}));
    Render.all();
    toast('Off day swapped to '+fmtDay(d)+(cands[0].sameWeek?' — same week, no overtime':' — different week, check hours'));
    return d;
  },
  markCompOff(date, did, forDid, sourceDate){
    DB.put('roster/'+date+'/'+did, {t:'O', comp:true, compFor:forDid||null, note:sourceDate?('Comp off for '+sourceDate):'Comp off'});
    if(sourceDate){ const orig=entry(sourceDate,did);
      if(orig&&orig.cover) DB.put('roster/'+sourceDate+'/'+did, Object.assign({},orig,{settled:true,settledOn:date})); }
    Render.all();
  },

  saveDriver(d){ if(!d.id) d.id=uid('dr'); DB.put('drivers/'+d.id, d); Render.all(); },
  removeDriver(id){ DB.put('drivers/'+id, null); Render.all(); },
  saveJob(j){ if(!j.id) j.id=uid('job'); DB.put('jobs/'+j.id, j); Render.all(); },
  saveVehicle(v){ if(!v.id) v.id=uid('veh'); DB.put('vehicles/'+v.id, v); Render.all(); },
  saveOverhead(o){ if(!o.id) o.id=uid('oh'); DB.put('overheads/'+o.id, o); Render.all(); },
  removeOverhead(id){ DB.put('overheads/'+id, null); Render.all(); },
  saveFuel(f){ if(!f.id) f.id=uid('fu'); DB.put('fuel/'+f.id, f);
    /* a fill is a genuine odometer sighting — better than anything estimated */
    const v=S.vehicles[f.vehicleId];
    if(v && Number(f.odo)>0 && Number(f.odo)>(Number(v.odo)||0))
      DB.put('vehicles/'+v.id, Object.assign({},v,{odo:Number(f.odo), odoSource:'read at a fuel fill', odoSetAt:f.date}));
    Render.all(); },
  removeFuel(id){ DB.put('fuel/'+id, null); Render.all(); },
  removeVehicle(id){ DB.put('vehicles/'+id, null); Render.all(); },
  saveMaint(m){ if(!m.id) m.id=uid('mt'); DB.put('maint/'+m.id, m);
    /* a workshop job that is open today takes the lorry off the road */
    const v=S.vehicles[m.vehicleId];
    if(v){ const down=m.status!=='done' && m.downFrom && m.downFrom<=todayISO() && (!m.downTo||m.downTo>=todayISO());
      const ns = down? 'workshop' : (v.status==='workshop'? 'active' : v.status);
      if(ns!==v.status) DB.put('vehicles/'+v.id, Object.assign({},v,{status:ns}));
      if(m.status==='done' && m.type==='service' && m.odo) DB.put('vehicles/'+v.id,
        Object.assign({}, S.vehicles[v.id], {lastServiceOdo:Number(m.odo), lastServiceDate:m.date,
          odo:Math.max(Number(S.vehicles[v.id].odo)||0, Number(m.odo)||0)}));
    }
    Render.all(); },
  removeMaint(id){ DB.put('maint/'+id, null); Render.all(); },
  saveBreakdown(b){ if(!b.id) b.id=uid('bd'); DB.put('breakdowns/'+b.id, b); Render.all(); },
  removeBreakdown(id){ DB.put('breakdowns/'+id, null); Render.all(); },
  removeJob(id){ DB.put('jobs/'+id, null); Render.all(); },
  saveSettings(s){ DB.put('settings', s); Render.all(); },

  /* ---------------- roster generator ----------------
     Fills a date range with duty / standby / off, honouring:
      - existing MC / Leave / locked cells (never overwritten)
      - offDaysPerWeek per driver, rotated so off days move around the week
      - shift rotation by week so nobody is stuck on nights
      - required headcount + standby per shift
      - minimum rest between shifts and max consecutive working days
  */
  generate(fromISO, toISO, opts){
    opts = opts||{};
    const drivers = activeDrivers();
    if(!drivers.length){ toast('Add drivers first'); return {days:0,gaps:[],breaches:0}; }
    const shifts = S.settings.shifts||[];
    const offPerWeek = clamp(S.settings.offDaysPerWeek|0, 0, 6);
    const maxCons = Math.max(1, S.settings.maxConsecutiveDays|0);
    const minRest = S.settings.minRestHours||0;
    const relax = !!opts.relax;
    const gaps=[]; let breaches=0;
    const plan={};

    const keep = (date,did)=>{
      const e=entry(date,did);
      if(!e) return null;
      if(e.t==='M'||e.t==='L') return e;
      if(e.locked) return e;
      if(opts.keepExisting && (e.cover||e.comp||e.swapFrom)) return e;
      return null;
    };
    const dates=[]; for(let d=fromISO; d<=toISO; d=addDays(d,1)) dates.push(d);
    dates.forEach(d=>{ plan[d]={}; drivers.forEach(dr=>{ const k=keep(d,dr.id); if(k) plan[d][dr.id]=k; }); });

    /* ---- pass 1: place off days, chronologically, so nobody runs past maxCons ---- */
    const weeks={}; dates.forEach(d=>{ const ws=weekStartOf(d); (weeks[ws]=weeks[ws]||[]).push(d); });
    const weekKeys=Object.keys(weeks).sort();
    const offOn={};                    // date -> count of drivers off
    const lastOff={};                  // did -> last off date (looks back before the range too)
    drivers.forEach(dr=>{
      let l=null;
      for(let i=1;i<=14;i++){ const d=addDays(fromISO,-i); const e=entry(d,dr.id);
        if(e && (e.t==='O'||e.t==='L'||e.t==='M')){ l=d; break; } }
      lastOff[dr.id]=l;
    });
    const offSet={}; drivers.forEach(dr=> offSet[dr.id]=new Set());
    const needOn = d => shiftsOn(d).reduce((a,sh)=> a+(sh.required|0)+(sh.standby|0), 0);
    weekKeys.forEach((ws,wi)=>{
      const days=weeks[ws];
      // rotate who picks first so the good days move around
      const order = drivers.slice().sort((a,b)=>
        ((drivers.indexOf(a)+wi)%drivers.length) - ((drivers.indexOf(b)+wi)%drivers.length));
      order.forEach(dr=>{
        for(let k=0;k<offPerWeek;k++){
          let best=null,bestSc=-1e9;
          days.forEach(date=>{
            if(plan[date][dr.id]) return;                 // MC / leave / locked
            if(offSet[dr.id].has(date)) return;
            const maxOffPerDay = Math.max(0, drivers.length - needOn(date));
            let unavailable=0; drivers.forEach(o=>{ const pe=plan[date][o.id];
              if(offSet[o.id].has(date) || (pe&&(pe.t==='O'||pe.t==='M'||pe.t==='L'))) unavailable++; });
            if(unavailable >= maxOffPerDay) return;        // shift would be left short
            let sc = 100;
            sc -= (offOn[date]||0)*14;                     // spread off days across the week
            const li = lastOff[dr.id];
            if(li){
              const run = Math.round((parseISO(date)-parseISO(li))/86400000) - 1;
              if(run > maxCons) sc -= (run-maxCons)*70;    // must not exceed the legal run
              if(run < 1) sc -= 60;                        // don't bunch two off days together
              if(run === maxCons) sc += 25;                // land it right on the limit
            }
            if(dr.preferredOff!=null && dr.preferredOff!=='' && dow(date)===Number(dr.preferredOff)) sc += 18;
            sc += ((drivers.indexOf(dr)*3 + wi*2 + dow(date)) % 5);
            if(sc>bestSc){ bestSc=sc; best=date; }
          });
          if(!best) break;
          offSet[dr.id].add(best); offOn[best]=(offOn[best]||0)+1; lastOff[dr.id]=best;
          plan[best][dr.id]={t:'O'};
        }
      });
    });

    /* ---- pass 2: fill duty then standby, day by day ---- */
    const feasible=(dr,date,sh)=>{
      const prev = plan[addDays(date,-1)] ? plan[addDays(date,-1)][dr.id] : entry(addDays(date,-1),dr.id);
      if(prev && (prev.t==='D'||prev.t==='S')){
        const p=shiftById(prev.shift);
        if(p){
          const [ph,pm]=p.end.split(':').map(Number), [ps,pms]=p.start.split(':').map(Number);
          let endM=ph*60+pm; if(endM<=ps*60+pms) endM+=1440;
          const [h2,m2]=sh.start.split(':').map(Number);
          if((1440+h2*60+m2-endM)/60 < minRest) return false;
        }
      }
      if(consecutivePlan(plan, dr.id, addDays(date,-1))+1 > maxCons) return false;
      if(!Fleet.driverFits(dr, sh)) return false;      // no licence for this shift, no argument
      return true;
    };
    /* which lorries this plan has already committed on a date, for overlapping shifts */
    const planUsed=(date, sh)=>{
      const used={};
      Object.keys(plan[date]||{}).forEach(did=>{ const e=plan[date][did];
        if(e.t!=='D' && e.t!=='S') return;
        if(!shiftsOverlap(sh, shiftById(e.shift))) return;
        const v=e.veh || ((S.drivers[did]||{}).vehicleId);
        if(v) used[v]=did;
      });
      return used;
    };
    const pickLorry=(dr, date, sh)=>{
      const pool=Fleet.live(); if(!pool.length) return {veh:null, none:true};
      const used=planUsed(date, sh);
      const free=pool.filter(v=> !Fleet.downOn(v.id,date) && !used[v.id] && Fleet.fits(v,sh));
      if(!free.length) return {veh:null, none:false};
      const own=free.find(v=>v.id===dr.vehicleId);
      return {veh:(own||free[0]).id, own:!!own};
    };
    const scoreFor=(dr,sh,date,wi)=>{
      let sc=0;
      const di=drivers.indexOf(dr);
      const fam=shiftsOn(date);
      const rot=(di+wi)%Math.max(1,fam.length);
      if(fam[rot] && fam[rot].id===sh.id) sc+=14;
      if(dr.shiftPref && dr.shiftPref!=='any'){ sc += dr.shiftPref===sh.id? 40 : -30; }
      const wh=weekHoursPlan(plan,dr.id,date);
      sc -= Math.max(0, wh + hoursBetween(sh.start,sh.end) - S.settings.maxWeeklyHours)*11;
      sc -= wh*0.55;                                    // level the hours across the fleet
      let offSoFar=0; { const ws=weekStartOf(date);
        for(let i=0;i<7;i++){ const d2=addDays(ws,i); const e2=(plan[d2]&&plan[d2][dr.id])||entry(d2,dr.id);
          if(e2 && e2.t==='O') offSoFar++; } }
      sc += offSoFar*7;                                 // whoever rested more, works next
      const prev = plan[addDays(date,-1)] ? plan[addDays(date,-1)][dr.id] : entry(addDays(date,-1),dr.id);
      if(prev && (prev.t==='D'||prev.t==='S') && prev.shift===sh.id) sc+=16;   // shift continuity
      sc -= consecutivePlan(plan,dr.id,addDays(date,-1))*4;
      sc += ((drivers.indexOf(dr)+dow(date))%3);
      /* a driver whose own lorry is free and suitable is the cheapest to roster —
         no handover, no key swap, and the maintenance history stays with one pair */
      const lorry=pickLorry(dr,date,sh);
      if(lorry.none) return sc;                  // no lorries in the register at all — ignore this factor
      if(!lorry.veh) sc-=70;                     // nothing left for him to drive
      else if(lorry.own) sc+=22;
      return sc;
    };

    dates.forEach(date=>{
      const wi = weekKeys.indexOf(weekStartOf(date));
      const todays = shiftsOn(date);
      const need={}; todays.forEach(sh=> need[sh.id]={duty:sh.required|0, sb:sh.standby|0});
      Object.keys(plan[date]).forEach(did=>{ const e=plan[date][did];
        if(e.t==='D'&&need[e.shift]) need[e.shift].duty=Math.max(0,need[e.shift].duty-1);
        if(e.t==='S'&&need[e.shift]) need[e.shift].sb=Math.max(0,need[e.shift].sb-1); });
      const pool = drivers.filter(dr=> !plan[date][dr.id]);
      const used={};
      const take=(sh,role)=>{
        let cands = pool.filter(dr=>!used[dr.id] && feasible(dr,date,sh));
        let forced=false;
        if(!cands.length && relax){ cands = pool.filter(dr=>!used[dr.id]); forced=true; }
        if(!cands.length){ gaps.push({date, shift:sh.name, kind:role==='D'?'duty':'standby'}); return false; }
        const pick = cands.map(dr=>({dr,sc:scoreFor(dr,sh,date,wi)})).sort((a,b)=>b.sc-a.sc)[0].dr;
        const lorry = pickLorry(pick, date, sh);
        if(!lorry.none && !lorry.veh && !relax){
          gaps.push({date, shift:sh.name, kind:'lorry'});   // a driver without a lorry is not cover
          return false;
        }
        used[pick.id]=1;
        plan[date][pick.id]={t:role, shift:sh.id};
        if(lorry.veh) plan[date][pick.id].veh=lorry.veh;
        if(forced){ breaches++; plan[date][pick.id].note='rule relaxed to man the shift'; }
        return true;
      };
      /* fill the hardest shift first — a night shift can only be worked by someone
         who was off or on nights yesterday, so it must get first pick of the pool */
      const byPressure = todays.slice().sort((a,b)=>{
        const fa=pool.filter(dr=>!used[dr.id]&&feasible(dr,date,a)).length - (need[a.id].duty+need[a.id].sb);
        const fb=pool.filter(dr=>!used[dr.id]&&feasible(dr,date,b)).length - (need[b.id].duty+need[b.id].sb);
        return fa-fb;
      });
      byPressure.forEach(sh=>{ for(let i=0;i<need[sh.id].duty;i++) if(!take(sh,'D')) break; });
      byPressure.forEach(sh=>{ for(let i=0;i<need[sh.id].sb;i++) if(!take(sh,'S')) break; });
      drivers.forEach(dr=>{ if(!plan[date][dr.id]) plan[date][dr.id]={t:'O'}; });
    });

    const writes=[];
    Object.keys(plan).forEach(date=> Object.keys(plan[date]).forEach(did=>{
      const e=plan[date][did], cur=entry(date,did);
      if(JSON.stringify(cur)!==JSON.stringify(e)) writes.push(['roster/'+date+'/'+did, e]);
    }));
    if(writes.length) DB.putMany(writes);
    Render.all();
    return {days:dates.length, gaps, breaches};
  },

  clearRange(fromISO,toISO,keepAbsence){
    const writes=[];
    for(let d=fromISO; d<=toISO; d=addDays(d,1)){
      const day=S.roster[d]; if(!day) continue;
      Object.keys(day).forEach(did=>{
        const e=day[did];
        if(keepAbsence && (e.t==='M'||e.t==='L')) return;
        writes.push(['roster/'+d+'/'+did, null]);
      });
    }
    if(writes.length) DB.putMany(writes);
    Render.all();
  }
};
function weekHoursPlan(plan, did, date){
  const ws=weekStartOf(date); let h=0;
  for(let i=0;i<7;i++){ const d=addDays(ws,i);
    const e=(plan[d]&&plan[d][did]) || entry(d,did);
    if(e&&(e.t==='D'||e.t==='S')) h+=shiftHours(e.shift); }
  return h;
}
function consecutivePlan(plan,did,date){
  let n=0,d=date;
  for(let i=0;i<14;i++){ const e=(plan[d]&&plan[d][did])||entry(d,did);
    if(e&&(e.t==='D'||e.t==='S')){ n++; d=addDays(d,-1);} else break; }
  return n;
}

  ],
  /* One word looked up in the dictionaries: exact phrase first, then the
     app's own seeded values (shift names, vehicle classes), then the
     number-carrying shapes. No recursion, so seg() can call it safely. */
  lookup(k){
    if(this.dict[k]!==undefined) return this.dict[k];
    if(this.data[k]!==undefined) return this.data[k];
    for(let i=0;i<this.patterns.length;i++){
      const m=k.match(this.patterns[i][0]);
      if(!m) continue;
      let out=this.patterns[i][1];
      for(let g=m.length-1; g>=1; g--){
        const piece=m[g]==null? '' : m[g], key2=piece.trim();
        let rep=this.dict[key2]!==undefined? this.dict[key2]
              : this.data[key2]!==undefined? this.data[key2] : null;
        const sub= rep===null? piece : piece.replace(key2,rep);
        out=out.split('$'+g).join(sub);
      }
      return out;
    }
    return null;
  },
  /* Tooltips, headings and alert lines are assembled by the app from a few
     known pieces plus live data — a plate, a date, a driver's name. Listing
     every combination would be hopeless, so when the whole string is unknown,
     split it on its separators and translate the pieces that ARE known. A name
     or an address matches nothing and comes back exactly as it was typed. */
  seps:/(\s*[\u00b7\u2014\u2013|]\s*|\s*[:\uff1a]\s+|\s*\/\s*|\s+\u2192\s+)/,
  seg(k){
    if(k.length<3) return null;
    const parts=k.split(this.seps);
    if(parts.length<3) return null;
    let changed=false;
    const out=parts.map((piece,i)=>{
      if(i%2) return piece===': '? '：' : piece;   // the separator itself
      const key=piece.trim();
      if(!key) return piece;
      const hit=this.lookup(key);
      if(hit===null) return piece;
      changed=true;
      return piece.replace(key,hit);
    });
    return changed? out.join('') : null;
  },
  t(str){
    const k=String(str);
    const hit=this.lookup(k);
    return hit!==null? hit : this.seg(k);
  },
  /* Walk what is on screen and swap anything the dictionary knows. The DOM is
     rebuilt from the English source on every render, so this never compounds,
     and a driver's name or a plate can only change if it happens to equal a
     dictionary key exactly — which no name does. */
  /* Warnings and explanatory notes are one paragraph with <b> and <a> inside,
     so they arrive as several text nodes. Matching them fragment by fragment is
     brittle; match the whole block on its combined text instead and replace the
     block. Anything replaced is marked so the text walker leaves it alone. */
  applyBlocks(scope){
    const sel='.alert, .empty, .tiny, p, li, .cm > span, .job .jm, .cand .cn';
    /* querySelectorAll skips the scope element itself, and a panel redrawn by
       its own handler IS the block -- include it. */
    const list=Array.prototype.slice.call(scope.querySelectorAll(sel));
    if(scope.matches && scope.matches(sel)) list.unshift(scope);
    list.forEach(el=>{
      /* A panel the app redraws itself (the pay preview, the distance
         estimate) keeps the done-flag from its previous content, which would
         hide the new English from the walker. Trust the flag only while the
         markup is still the markup we wrote. */
      if(el.dataset.i18nDone){
        if(this.wrote.get(el)===el.innerHTML) return;
        delete el.dataset.i18nDone;
      }
      if(el.querySelector(sel)) return;                 // only innermost blocks
      /* Replacing innerHTML would throw away a link or button and the handler
         attached to it, so leave those blocks to the text walker, which swaps
         each fragment in place and leaves the controls working. */
      if(el.querySelector('a, button, input, select, textarea')) return;
      const key=(el.textContent||'').replace(/\s+/g,' ').trim();
      if(!key || key.length<8) return;
      let hit=this.blocks[key];
      if(hit===undefined){
        for(let i=0;i<this.blockPatterns.length;i++){
          const m=key.match(this.blockPatterns[i][0]);
          if(!m) continue;
          hit=this.blockPatterns[i][1];
          for(let g=m.length-1; g>=1; g--){
            const piece=m[g]==null?'':m[g], key2=piece.trim();
            const rep=this.dict[key2]!==undefined? this.dict[key2]
                    : this.data[key2]!==undefined? this.data[key2] : null;
            const sub= rep===null? piece : piece.replace(key2,rep);
            hit=hit.split('$'+g).join(sub);
          }
          break;
        }
      }
      if(hit!==undefined){
        if(!this.wasHtml.has(el)) this.wasHtml.set(el, el.innerHTML);
        el.innerHTML=hit; el.dataset.i18nDone='1'; this.wrote.set(el, el.innerHTML);
      }
    });
  },
  /* The views are rebuilt from their English source on every render, but the
     sidebar, the header and the modal frame are static markup — translated in
     place, they would stay Chinese forever. Remember what each one said and
     put it back when the language goes to English. WeakMaps, so a node the
     next render throws away is collected with it. */
  was:new WeakMap(), wasHtml:new WeakMap(), wrote:new WeakMap(),
  revert(root){
    const scope=root||document.body;
    Array.prototype.slice.call(scope.querySelectorAll('*')).forEach(el=>{
      if(this.wasHtml.has(el)){ el.innerHTML=this.wasHtml.get(el); this.wasHtml.delete(el); }
      if(el.dataset && el.dataset.i18nDone) delete el.dataset.i18nDone;
    });
    const walker=document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, null);
    const jobs=[]; let n;
    while((n=walker.nextNode())) jobs.push(n);
    jobs.forEach(node=>{ if(this.was.has(node)){ node.nodeValue=this.was.get(node); this.was.delete(node); } });
    scope.querySelectorAll('[data-ph0]').forEach(el=>{ el.setAttribute('placeholder', el.dataset.ph0); });
    scope.querySelectorAll('[data-ti0]').forEach(el=>{ el.setAttribute('title', el.dataset.ti0); });
  },
  apply(root){
    if(LANG!=='zh') return;
    const scope=root||document.body;
    this.applyBlocks(scope);
    const walker=document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, {
      acceptNode(n){
        if(!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        const p=n.parentNode;
        if(!p || p.nodeName==='SCRIPT' || p.nodeName==='STYLE') return NodeFilter.FILTER_REJECT;
        for(let q=p; q && q!==document.body; q=q.parentNode)
          if(q.dataset && q.dataset.i18nDone) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }});
    const jobs=[]; let n;
    while((n=walker.nextNode())) jobs.push(n);
    jobs.forEach(node=>{
      const raw=node.nodeValue, trimmed=raw.trim();
      let hit=this.t(trimmed);
      if(hit===null){                                    // whole paragraphs, e.g.
        const blk=this.blocks[trimmed];                  // a checkbox label
        if(blk!==undefined && blk.indexOf('<')<0) hit=blk;
      }
      if(hit!==null && hit!==trimmed){
        if(!this.was.has(node)) this.was.set(node, raw);   // keep the English
        node.nodeValue=raw.replace(trimmed, hit);
      }
    });
    scope.querySelectorAll('[placeholder]').forEach(el=>{
      if(el.dataset.ph0===undefined) el.dataset.ph0=el.getAttribute('placeholder')||'';
      const hit=this.t(el.dataset.ph0); if(hit) el.setAttribute('placeholder',hit);
    });
    scope.querySelectorAll('[title]').forEach(el=>{
      if(el.dataset.ti0===undefined) el.dataset.ti0=el.getAttribute('title')||'';
      const hit=this.t(el.dataset.ti0); if(hit) el.setAttribute('title',hit);
    });
  },
  set(lang){
    LANG = (lang==='zh')? 'zh':'en';
    try{ localStorage.setItem('da.lang', LANG); }catch(e){}
    const dow = LANG==='zh'? DOW_ZH : DOW_EN, mon = LANG==='zh'? MON_ZH : MON_EN;
    for(let i=0;i<7;i++) DOW[i]=dow[i];
    for(let i=0;i<12;i++) MON[i]=mon[i];
    document.documentElement.lang = LANG==='zh'? 'zh-Hans':'en';
    if(LANG==='en') this.revert(document.body);
    Render.all();
  }
};

      days.forEach(dt=>{
        const e=entry(dt,d.id), c=e?e.t:'_';

        const cls=['cell','c-'+c]; if(isWeekend(dt)) cls.push('we'); if(dt===todayISO()) cls.push('today');

        const tip=[fmtDay(dt),CODES[c].label,(e&&e.shift)?shiftName(e.shift):'',
          (e&&e.cover)?('covering '+((S.drivers[e.cover]||{}).name||'')):'',

          (e&&(e.t==='D'||e.t==='S'))? ('lorry: '+(Fleet.plate(Fleet.vehicleFor(dt,d.id))||'none')):'',

      h+='<td class="num tiny">'+mh+'</td><td class="num tiny" style="color:'+(ot>0?'var(--bad)':'var(--ink-3)')+'">'+(ot||'')+'</td>'+
         '<td class="num tiny" style="color:'+(bal>0?'var(--ok)':bal<0?'var(--bad)':'var(--ink-3)')+'">'+(bal?(bal>0?'+':'')+bal:'')+'</td></tr>';

    (S.settings.shifts||[]).forEach(sh=>{

        esc(sh.name)+' <span class="tiny">'+esc(ct?ct.name:'')+' · need '+sh.required+'+'+sh.standby+'</span></td>';
      days.forEach(dt=>{

  regular(){

      kpi('Driver-days a week', F.demand, 'across every job, on the days each runs','')+
      kpi('Busiest single day', F.peak, 'drivers needed at the peak','')+

  cost(){
    $('#topActions').innerHTML=
      '<button class="btn sm" onclick="Render.moveMonth(-1)">‹</button>'+
      '<b style="min-width:130px;text-align:center">'+MON[MONTH.m]+' '+MONTH.y+'</b>'+
      '<button class="btn sm" onclick="Render.moveMonth(1)">›</button>'+
      '<button class="btn sm" onclick="Flow.exportCost()">↓ CSV</button>';

    const {rows,total}=Pay.fleetMonth(MONTH);
    const noPay=rows.filter(r=>Pay.basic(r.driver)<=0).length;
    const F=Rules.feasibility();
    const structural = F.otPerDriver>0 ? F.otPerDriver*4.345*rows.reduce((a,r)=>a+Pay.otRate(r.driver),0) : 0;

    let h='<div class="kpis" style="margin-bottom:16px">'+
      kpi('Overtime cost', Pay.money(total.otPay), total.otHours.toFixed(1)+' OT hours', total.otPay>0?'warn':'ok')+
      kpi('Rest-day cost', Pay.money(total.restDayPay), total.restDays+' rest day(s) worked', total.restDayPay>0?'bad':'ok')+
      kpi('Total on top of salaries', Pay.money(total.extraCost), MON[MONTH.m]+' '+MONTH.y, total.extraCost>0?'warn':'ok')+
      kpi('Drivers over the cap', rows.filter(r=>r.otHours>(S.settings.maxMonthlyOT||72)).length,
          'more than '+(S.settings.maxMonthlyOT||72)+'h OT', rows.filter(r=>r.otHours>(S.settings.maxMonthlyOT||72)).length?'bad':'ok')+
    '</div>';

    if(noPay===rows.length && rows.length){
      h+='<div class="alert warn"><b>No basic pay recorded yet.</b> Put each driver\'s monthly basic salary in the '+
        '<a href="#" onclick="VIEW=\'drivers\';Render.all();return false">Drivers</a> screen and every figure here fills in. '+
        'Nothing is calculated from a blank salary.</div>';
    } else if(noPay){
      h+='<div class="alert warn">'+noPay+' driver(s) have no basic pay recorded, so they are costed at zero.</div>';
    }

    if(F.otPerDriver>0){
      h+='<div class="alert bad"><b>The shift pattern itself creates overtime.</b> '+
        F.need+' drivers on shift every day over '+F.n+' drivers with '+S.settings.offDaysPerWeek+' off day(s) a week '+
        'works out at '+F.avgHours+'h each — '+F.otPerDriver+'h a week above the '+S.settings.maxWeeklyHours+'h norm, '+
        'roughly '+Pay.money(structural)+' a month across the fleet before a single MC. '+
        'Another driver, a smaller headcount on one shift, or a shorter shift removes it.</div>';
    } else if(total.otHours>0){
      const hi=rows.slice().sort((a,b)=>b.otHours-a.otHours)[0];
      const lo=rows.slice().filter(r=>r.totalHours>0).sort((a,b)=>a.totalHours-b.totalHours)[0];
      h+='<div class="alert warn"><b>This overtime is avoidable.</b> The shift pattern averages '+F.avgHours+
        'h a week, inside the '+S.settings.maxWeeklyHours+'h norm — the '+Pay.money(total.otPay)+
        ' comes from work landing unevenly'+
        (hi&&lo? ': '+esc(hi.driver.name)+' books '+hi.totalHours+'h this month while '+esc(lo.driver.name)+' books '+lo.totalHours+'h':'')+
        '. Re-run <a href="#" onclick="VIEW=\'roster\';Render.all();return false">Auto-plan</a> to level it out.</div>';
    }

    h+='<div class="card"><div class="hd"><h3>Per driver — '+MON[MONTH.m]+' '+MONTH.y+'</h3>'+
      '<span class="tiny muted" style="margin-left:auto">hourly basic rate = 12 × monthly basic ÷ (52 × '+(S.settings.maxWeeklyHours||44)+')</span></div>'+
      '<div class="bd scroll"><table class="tbl"><thead><tr>'+
      '<th>Driver</th><th class="num">Basic</th><th class="num">Hourly</th><th class="num">Hours</th>'+
      '<th class="num">OT hrs</th><th class="num">OT pay</th><th class="num">Rest days</th><th class="num">Rest-day pay</th>'+
      '<th class="num">Extra cost</th><th>Notes</th></tr></thead><tbody>';
    rows.sort((a,b)=>b.extraCost-a.extraCost).forEach(r=>{
      const d=r.driver, cap=S.settings.maxMonthlyOT||72;
      h+='<tr><td><b>'+esc(d.name)+'</b>'+(d.empNo?'<div class="tiny muted">'+esc(d.empNo)+'</div>':'')+'</td>'+
        '<td class="num tiny">'+(Pay.basic(d)? Pay.money(Pay.basic(d))+(d.payType==='hourly'?'/h':'/mth') : '—')+'</td>'+
        '<td class="num tiny">'+(Pay.basic(d)? Pay.money(Pay.hourly(d)) : '—')+'</td>'+
        '<td class="num">'+r.totalHours+'</td>'+
        '<td class="num"><span class="'+(r.otHours>cap?'pill bad':'')+'">'+(r.otHours||'')+'</span></td>'+
        '<td class="num">'+(r.otPay? Pay.money(r.otPay):'')+'</td>'+
        '<td class="num">'+(r.restDayShifts.length||'')+'</td>'+
        '<td class="num">'+(r.restDayPay? Pay.money(r.restDayPay):'')+'</td>'+
        '<td class="num"><b>'+(r.extraCost? Pay.money(r.extraCost):'—')+'</b></td>'+
        '<td class="tiny muted">'+(r.flags.length? esc(r.flags.join(' · ')) : (r.restDayShifts.length? 'rest day worked, not yet given back':''))+'</td></tr>';
    });
    h+='</tbody><tfoot><tr style="font-weight:700;background:var(--panel-2)">'+
      '<td colspan="4">Fleet total</td><td class="num">'+total.otHours.toFixed(1)+'</td>'+
      '<td class="num">'+Pay.money(total.otPay)+'</td><td class="num">'+total.restDays+'</td>'+
      '<td class="num">'+Pay.money(total.restDayPay)+'</td><td class="num">'+Pay.money(total.extraCost)+'</td><td></td></tr></tfoot>';
    h+='</table></div></div>';

    // rest days worked but not returned — the avoidable money
    const owed=[];
    rows.forEach(r=> r.restDayShifts.forEach(x=> owed.push({d:r.driver, x})));
    h+='<div class="card" style="margin-top:16px"><div class="hd"><h3>Rest days worked and not given back</h3>'+
      '<span class="tiny muted" style="margin-left:auto">give the day back in the same week and this cost disappears</span></div><div class="bd">';
    if(!owed.length) h+='<div class="tiny muted">None. Every rest day worked this month has been swapped for another day off — which is why there is nothing extra to pay for them.</div>';
    else{
      h+='<table class="tbl"><thead><tr><th>Date</th><th>Driver</th><th>Shift</th><th class="num">Hours</th><th class="num">Days\' salary</th><th class="num">Cost</th><th></th></tr></thead><tbody>';
      owed.sort((a,b)=>a.x.date.localeCompare(b.x.date)).forEach(o=>{
        const e=entry(o.x.date,o.d.id)||{};
        h+='<tr><td class="tiny">'+esc(o.x.date)+'</td><td><b>'+esc(o.d.name)+'</b></td>'+
          '<td class="tiny">'+esc(shiftName(o.x.shift))+'</td><td class="num">'+o.x.hrs+'</td>'+
          '<td class="num">'+o.x.daysPay+'×</td><td class="num"><b>'+Pay.money(o.x.pay)+'</b></td>'+
          '<td>'+(e.cover? '<button class="btn sm p" onclick="Flow.settle(\''+o.x.date+'\',\''+o.d.id+'\',\''+e.cover+'\')">Give the day back</button>':'')+'</td></tr>';
      });
      h+='</tbody></table>';
    }
    h+='</div></div>';

    h+='<div class="tiny muted" style="margin-top:12px;line-height:1.7">'+
      'Figures follow the Employment Act: overtime at '+(S.settings.otMultiplier||1.5)+'× the hourly basic rate, capped at '+
      (S.settings.maxMonthlyOT||72)+'h a month; work on a rest day at the employer\'s request pays 1 day\'s salary for half the '+
      'normal daily hours or less and 2 days\' salary for more, plus overtime beyond '+(S.settings.normalDailyHours||8)+'h. '+
      'Part 4 covers workmen up to '+Pay.money(S.settings.workmanSalaryCap||4500)+' and non-workmen up to '+
      Pay.money(S.settings.nonWorkmanSalaryCap||2600)+' basic. '+
      'This is a planning estimate, not a payslip — allowances, levies, CPF and public holidays are not included.</div>';
    $('#view').innerHTML=h;
  },

  /* -------------------------- OWNER SUMMARY ------------------------- */
  owner(){
    $('#topActions').innerHTML=
      '<button class="btn sm" onclick="Render.moveMonth(-1)">‹</button>'+
      '<b style="min-width:130px;text-align:center">'+MON[MONTH.m]+' '+MONTH.y+'</b>'+
      '<button class="btn sm" onclick="Render.moveMonth(1)">›</button>'+
      '<button class="btn sm" onclick="window.print()">⎙ Print</button>'+
      '<button class="btn sm" onclick="Flow.exportStats()">↓ CSV</button>';

    const days=monthDays(MONTH.y,MONTH.m), from=days[0], to=days[days.length-1];
    const fm=OpCost.fuelMode(from,to);
    const oc=OpCost.total(from,to,fm), ou=OpCost.unit(from,to,fm);
    let pm=MONTH.m-1, py=MONTH.y; if(pm<0){pm=11;py--;}
    const pd=monthDays(py,pm);
    const prev=OpCost.total(pd[0], pd[pd.length-1], OpCost.fuelMode(pd[0],pd[pd.length-1]));
    const delta = prev.total>0? (oc.total-prev.total)/prev.total*100 : null;
    const rev = Revenue.any()? Revenue.amount(from,to) : null;
    const veh=Stats.vehicleStats(from,to), hrs=Stats.driverHours(from,to);
    const liveV=Fleet.live().length, onRoad=Fleet.availableOn(todayISO()).length;

    /* the headline */
    let h='<div class="card" style="margin-bottom:16px"><div class="bd" style="display:flex;gap:32px;flex-wrap:wrap;align-items:flex-end">'+
      '<div><div class="tiny muted" style="text-transform:uppercase;letter-spacing:.05em;font-weight:700">Operating cost · '+
        MON[MONTH.m]+' '+MONTH.y+'</div>'+
        '<div style="font-size:44px;font-weight:750;letter-spacing:-.02em;line-height:1.05;margin-top:4px">'+Pay.money(oc.total)+'</div>'+
        (delta!=null? '<div class="tiny" style="margin-top:4px;color:'+(delta>0?'var(--bad)':'var(--ok)')+'">'+
          (delta>0?'▲ ':'▼ ')+Math.abs(Math.round(delta))+'% on '+MON[pm]+' ('+Pay.money(prev.total)+')</div>'
          : '<div class="tiny muted" style="margin-top:4px">no figures for '+MON[pm]+' to compare with</div>')+
      '</div>';
    if(rev!=null){
      const margin=rev-oc.total, pct=rev>0? margin/rev*100 : 0;
      h+='<div><div class="tiny muted" style="text-transform:uppercase;letter-spacing:.05em;font-weight:700">Contract income</div>'+
        '<div style="font-size:30px;font-weight:700;line-height:1.1;margin-top:4px">'+Pay.money(rev)+'</div></div>'+
        '<div><div class="tiny muted" style="text-transform:uppercase;letter-spacing:.05em;font-weight:700">Margin</div>'+
        '<div style="font-size:30px;font-weight:700;line-height:1.1;margin-top:4px;color:'+(margin>=0?'var(--ok)':'var(--bad)')+'">'+
        Pay.money(margin)+'</div><div class="tiny muted">'+Math.round(pct)+'% of income</div></div>';
    }
    h+='<div style="flex:1"></div>'+
      '<div class="tiny muted" style="max-width:260px;text-align:right">'+
      (rev==null? 'Put a monthly value on each regular job and this page shows income and margin too.' :
        'Income counts the regular jobs only — ad-hoc work is not in it.')+'</div>';
    h+='</div></div>';

    h+='<div class="kpis" style="margin-bottom:16px">'+
      kpi('Cost per km', ou.perKm!=null? Pay.money(ou.perKm):'—', Math.round(ou.km).toLocaleString()+' km logged','')+
      kpi('Cost per lorry per day', liveV? Pay.money(oc.total/liveV/days.length):'—', liveV+' lorries','')+
      kpi('Fixed overheads', Pay.money(Overheads.monthlyRunRate()), 'a month, before a wheel turns','')+
      kpi('Overtime', Math.round(oc.labour.otH)+'h', Pay.money(oc.labour.premium)+' including rest days',
          oc.labour.otH>0?'warn':'ok')+
      kpi('Lorries on the road', onRoad+' / '+liveV, (liveV-onRoad)+' off the road today', onRoad<liveV?'warn':'ok')+
      kpi('Drivers', hrs.length, Math.round(hrs.reduce((a,r)=>a+r.total,0)).toLocaleString()+'h worked','')+
    '</div>';

    /* composition */
    h+='<div class="card" style="margin-bottom:16px"><div class="hd"><h3>Where the money went</h3>'+
      '<span class="tiny muted" style="margin-left:auto">'+MON[MONTH.m]+' '+MONTH.y+'</span></div><div class="bd">';
    if(oc.total>0){
      h+=VIZ.composition('bo', oc.parts, {aria:'Operating cost split'});
      h+='<div class="vlegend" style="margin-top:12px">'+oc.parts.filter(p=>p.value>0).map(p=>
        '<span><i style="background:'+p.fill+'"></i>'+esc(p.name)+' <b>'+Pay.money(p.value)+'</b> '+
        '<span class="muted">'+Math.round(p.value/oc.total*100)+'%</span></span>').join('')+'</div>';
    } else h+='<div class="tiny muted">No costs recorded for this month.</div>';
    h+='</div></div>';

    /* twelve months */
    const yr=Stats.series('month', MONTH, 'cost');
    if(yr.some(x=>x.value>0))
      h+='<div class="card" style="margin-bottom:16px"><div class="hd"><h3>Operating cost, twelve months</h3></div>'+
        '<div class="bd">'+VIZ.columns('bt', yr, {money:true, aria:'Operating cost by month'})+'</div></div>';

    /* the money that need not be spent */
    const av=Boss.avoidable(from,to);
    const avTotal=av.reduce((a,x)=>a+x.amount,0);
    h+='<div class="card" style="margin-bottom:16px"><div class="hd"><h3>Spending that could be avoided</h3>'+
      '<span class="pill '+(avTotal>0?'warn':'ok')+'" style="margin-left:auto">'+
      (avTotal>0? 'about '+Pay.money(avTotal) : 'nothing found')+'</span></div><div class="bd">';
    if(!av.length) h+='<div class="tiny muted">Nothing obvious. No movable overtime, no rest days owed, no repeat breakdowns, '+
      'no idle lorries, and the shift pattern is not manufacturing overtime on its own.</div>';
    else av.forEach((x,i)=> h+='<div style="display:flex;gap:14px;align-items:flex-start;padding:10px 0'+
      (i?';border-top:1px solid var(--line-2)':'')+'">'+
      '<div style="flex:1"><div style="font-weight:650">'+esc(x.name)+'</div>'+
      '<div class="tiny muted" style="margin-top:3px">'+esc(x.detail)+'</div></div>'+
      '<div style="text-align:right;white-space:nowrap"><div style="font-weight:750;font-size:15px">'+Pay.money(x.amount)+'</div>'+
      '<button class="btn sm" style="margin-top:4px" onclick="'+x.go+'">Look</button></div></div>');
    if(av.length) h+='<div class="tiny muted" style="margin-top:10px">These are estimates of what the same month would have cost '+
      'with the problem removed, not guaranteed savings.</div>';
    h+='</div></div>';

    /* what is about to go wrong */
    const rk=Boss.risks();
    h+='<div class="card"><div class="hd"><h3>Needs attention</h3>'+
      '<span class="pill '+(rk.some(r=>r.level==='bad')?'bad':rk.length?'warn':'ok')+'" style="margin-left:auto">'+
      (rk.length? rk.length+' item(s)':'all clear')+'</span></div><div class="bd">';
    if(!rk.length) h+='<div class="tiny muted">Nothing expiring, nothing overdue, every shift manned, no driver over the overtime cap.</div>';
    else rk.slice(0,14).forEach(r=> h+='<div class="alert '+(r.level==='bad'?'bad':'warn')+'" style="display:flex;gap:10px;align-items:center">'+
      '<span style="flex:1">'+esc(r.text)+'</span>'+
      '<a href="#" onclick="'+r.go+';return false" style="white-space:nowrap">open →</a></div>');
    if(rk.length>14) h+='<div class="tiny muted">+'+(rk.length-14)+' more on the workshop board.</div>';
    h+='</div></div>';

    $('#view').innerHTML=h;
    VIZ.wire();
  },

  /* ------------------------------ REPORTS --------------------------- */
  stats(){
    SUB.gran = SUB.gran || 'day';
    SUB.metric = SUB.metric || 'km';
    SUB.vmetric = SUB.vmetric || 'km';
    const seg=(id,cur,opts)=> '<div class="seg">'+opts.map(o=>{const [k,l]=o.split('|');
      return '<button class="'+(cur===k?'on':'')+'" onclick="SUB.'+id+'=\''+k+'\';Render.all()">'+esc(l)+'</button>';}).join('')+'</div>';

    $('#topActions').innerHTML=
      '<button class="btn sm" onclick="Render.moveMonth(-1)">‹</button>'+
      '<b style="min-width:120px;text-align:center">'+MON[MONTH.m]+' '+MONTH.y+'</b>'+
      '<button class="btn sm" onclick="Render.moveMonth(1)">›</button>'+
      '<button class="btn sm" onclick="SUB.table=!SUB.table;Render.all()">'+(SUB.table?'Hide table':'Show table')+'</button>'+
      '<button class="btn sm" onclick="Flow.exportStats()">↓ CSV</button>';

    const {from,to,buckets}=Stats.span(SUB.gran, MONTH);
    const hrs=Stats.driverHours(from,to);
    const veh=Stats.vehicleStats(from,to);
    const totH=hrs.reduce((a,r)=>a+r.total,0), totOT=hrs.reduce((a,r)=>a+r.ot,0);
    const totKm=veh.reduce((a,r)=>a+r.km,0), totTrips=veh.reduce((a,r)=>a+r.trips,0);
    const spanLabel = SUB.gran==='day'? MON[MONTH.m]+' '+MONTH.y
                    : SUB.gran==='week'? 'the 12 weeks to '+fmtDay(to)
                    : SUB.gran==='month'? 'the 12 months to '+MON[MONTH.m]+' '+MONTH.y
                    : 'the 5 years to '+MONTH.y;

    let h='<div class="row" style="margin-bottom:14px;align-items:center">'+
      '<div><label class="f">Period</label>'+seg('gran',SUB.gran,['day|Daily','week|Weekly','month|Monthly','year|Yearly'])+'</div>'+
      '<div><label class="f">Trend shows</label>'+seg('metric',SUB.metric,['cost|Operating cost','km|Distance','trips|Trips','hours|Working hours','fuel|Fuel cost'])+'</div>'+
      '<div class="grow"></div>'+
      '<div class="tiny muted">'+esc(spanLabel)+'</div></div>';

    const fuelMode=OpCost.fuelMode(from,to);
    const oc=OpCost.total(from,to,fuelMode), ou=OpCost.unit(from,to,fuelMode);
    h+='<div class="kpis" style="margin-bottom:16px">'+
      kpi('Operating cost', Pay.money(oc.total), esc(spanLabel), oc.total>0?'warn':'')+
      kpi('Cost per km', ou.perKm!=null? Pay.money(ou.perKm) : '—',
          ou.km? Math.round(ou.km).toLocaleString()+' km covered':'no distance logged','')+
      kpi('Working hours', Math.round(totH).toLocaleString(), hrs.length+' drivers on the roster','')+
      kpi('Of which overtime', Math.round(totOT).toLocaleString()+'h',
          totH? Math.round(totOT/totH*100)+'% of hours worked':'—', totOT>0?'warn':'ok')+
      kpi('Distance', Math.round(totKm).toLocaleString()+' km', veh.length+' lorries moved','')+
      kpi('Trips', totTrips.toLocaleString(), 'delivery jobs attributed','')+
      (function(){ const ft=FuelLog.totals(from,to);
        if(ft.cost>0) return kpi('Fuel', Pay.money(ft.cost), Math.round(ft.litres).toLocaleString()+' litres · '+ft.fills+' fills','');
        const est=veh.reduce((a,r)=> a+FuelLog.estimateCost(r.id, r.km).cost, 0);
        return est>0? kpi('Fuel (estimated)', Pay.money(est), 'no fills logged — from distance','warn') : ''; })()+
    '</div>';

    /* --- where the money goes --- */
    h+='<div class="card" style="margin-bottom:16px"><div class="hd"><h3>What the operation costs</h3>'+
      '<span class="tiny muted" style="margin-left:auto">'+esc(spanLabel)+'</span></div><div class="bd">';
    if(oc.total<=0){
      h+='<div class="tiny muted">Nothing to cost yet. Costs come from basic pay on the driver records, the roster (overtime and '+
        'rest days), the fuel log and the workshop log — fill any of those in and this fills in with it.</div>';
    } else {
      h+=VIZ.composition('oc', oc.parts, {aria:'Operating cost split'});
      h+='<div class="vlegend" style="margin-top:12px">'+oc.parts.filter(p=>p.value>0).map(p=>
        '<span><i style="background:'+p.fill+'"></i>'+esc(p.name)+' <b>'+Pay.money(p.value)+'</b> '+
        '<span class="muted">'+Math.round(p.value/oc.total*100)+'%</span></span>').join('')+'</div>';
      const notes=[];
      if(oc.labour.otH>0) notes.push(oc.labour.otH+'h of overtime');
      if(oc.labour.restDays>0) notes.push(oc.labour.restDays+' rest day(s) worked and unreturned');
      if(oc.fuelInfo.estimated) notes.push('fuel is estimated from distance — log fills to replace it');
      if(oc.workshopInfo.jobs>0) notes.push(oc.workshopInfo.jobs+' workshop item(s)');
      if(ou.perTrip!=null) notes.push(Pay.money(ou.perTrip)+' a trip over '+ou.trips+' trips');
      if(notes.length) h+='<div class="tiny muted" style="margin-top:10px">'+esc(notes.join(' · '))+'.</div>';
      h+='<div class="tiny muted" style="margin-top:6px">Basic pay is spread across the calendar days of its month, because a monthly '+
        'salary is owed whether or not the lorry moved; overtime is charged to the day the week crosses '+
        (S.settings.maxWeeklyHours||44)+'h, so a day, a week and a month all add up. '+
        (ou.perKm!=null? 'Cost per km divides the whole cost by the distance actually logged — log every trip or it reads high. ':'')+
        'Not included: CPF, levies, insurance, road tax, parking, ERP or finance.</div>';
    }
    h+='</div></div>';

    /* --- what to do about it --- */
    const sug=Balance.suggest(from,to);
    h+='<div class="card" style="margin-bottom:16px"><div class="hd"><h3>Suggested changes</h3>'+
      '<span class="pill '+(sug.length? (sug.some(x=>x.level==='bad')?'bad':'warn') : 'ok')+'" style="margin-left:auto">'+
      (sug.length? sug.length+' to look at' : 'nothing outstanding')+'</span></div><div class="bd">';
    if(!sug.length) h+='<div class="tiny muted">Every shift is manned, no rest day is owed, every job has a driver and a lorry, '+
      'and no overtime can be moved to someone with room for it. Nothing to change.</div>';
    else sug.forEach((x,i)=>{
      h+='<div style="display:flex;gap:12px;align-items:flex-start;padding:10px 0'+
        (i? ';border-top:1px solid var(--line-2)':'')+'">'+
        '<span class="pill '+(x.level==='bad'?'bad':x.level==='warn'?'warn':'neutral')+'" style="margin-top:2px">'+
          (x.level==='bad'?'fix':x.level==='warn'?'save':'note')+'</span>'+
        '<div style="flex:1"><div style="font-weight:650">'+esc(x.title)+'</div>'+
        '<div class="tiny muted" style="margin-top:3px">'+esc(x.detail)+'</div></div>'+
        '<button class="btn sm'+(x.level==='bad'?' p':'')+'" style="flex:0 0 auto" onclick="'+x.act+'">'+esc(x.label)+'</button>'+
      '</div>';
    });
    h+='</div></div>';

    /* --- trend --- */
    const unit={km:'km', trips:'', hours:'h', fuel:'', cost:''}[SUB.metric];
    const asMoney = SUB.metric==='fuel' || SUB.metric==='cost';
    const mname={km:'Distance travelled', trips:'Trips completed', hours:'Working hours',
      fuel:'Fuel cost', cost:'Operating cost'}[SUB.metric];
    const series=Stats.series(SUB.gran, MONTH, SUB.metric);
    const anyTrend=series.some(x=>x.value>0);
    h+='<div class="card" style="margin-bottom:16px"><div class="hd"><h3>'+esc(mname)+' over time</h3>'+
      '<span class="tiny muted" style="margin-left:auto">whole fleet · '+
      (SUB.gran==='day'?'one column per day':SUB.gran==='week'?'one column per week':'one column per month')+'</span></div>'+
      '<div class="bd">'+
      (anyTrend? VIZ.columns('trend', series, {unit, money:asMoney, aria:mname+' by '+SUB.gran})
               : '<div class="empty">Nothing recorded in this period.</div>')+
      '</div></div>';

    /* --- driver hours: two series, so a legend --- */
    h+='<div class="card" style="margin-bottom:16px"><div class="hd"><h3>Working hours per driver</h3>'+
      '<div class="vlegend" style="margin-left:auto">'+
        '<span><i style="background:var(--s1)"></i>Within '+(S.settings.maxWeeklyHours||44)+'h a week</span>'+
        '<span><i style="background:var(--s2)"></i>Overtime</span></div></div><div class="bd">';
    if(!hrs.length) h+='<div class="empty">No rostered shifts in this period.</div>';
    else{
      h+=VIZ.barsH('dh', hrs.map(r=>({label:r.name, total:r.total,
        note:r.days+' shifts'+(r.standby?' · '+Math.round(r.standby)+'h on standby':''),
        segments:[{value:r.normal, fill:'var(--s1)', name:'Normal'},
                  {value:r.ot, fill:'var(--s2)', name:'Overtime'}]})), {unit:'h', aria:'Working hours per driver'});
      h+='<div class="tiny muted" style="margin-top:10px">Hours are the rostered shift lengths. Overtime is whatever a week runs past '+
        (S.settings.maxWeeklyHours||44)+'h; a week split by the edge of this period is counted only for the days shown.</div>';
    }
    h+='</div></div>';

    /* --- fuel --- */
    /* fuel spend stands on its own — a lorry that was fuelled belongs here even
       if no job was ever attributed to it */
    const ftot=FuelLog.totals(from,to);
    const fuelIds={}; veh.forEach(r=>fuelIds[r.id]=true); Object.keys(ftot.byVehicle).forEach(id=>fuelIds[id]=true);
    const fuelBase=Object.keys(fuelIds).map(id=>{
      const known=veh.find(x=>x.id===id); const v=Fleet.byId(id);
      return known || {id, plate:(v&&v.plate)||'—', type:(v&&v.type)||'', km:0, trips:0};
    });
    const fuelRows=fuelBase.map(r=>{ const t=ftot.byVehicle[r.id]||{cost:0,litres:0,fills:0};
      const c=FuelLog.consumption(r.id), e=FuelLog.efficiency(r.id);
      const est=FuelLog.estimateCost(r.id, r.km);
      return {plate:r.plate, km:r.km, cost:t.cost, litres:t.litres, fills:t.fills,
        lPer100:c.lPer100, measured:!!e.lPer100, source:c.source, estCost:est.cost};
    });
    const anyFuel=fuelRows.some(r=>r.cost>0);
    h+='<div class="card" style="margin-bottom:16px"><div class="hd"><h3>Fuel cost per lorry</h3>'+
      '<span class="tiny muted" style="margin-left:auto">'+(anyFuel? 'from the fuel log' : 'estimated from distance — no fills logged')+
      '</span></div><div class="bd">';
    const fc=fuelRows.filter(r=> (anyFuel? r.cost : r.estCost) > 0)
      .sort((a,b)=> (anyFuel? b.cost-a.cost : b.estCost-a.estCost));
    if(!fc.length) h+='<div class="empty">No fuel spend to show. Log fills under '+
      '<a href="#" onclick="VIEW=\'fleet\';SUB.fleetTab=\'fuel\';Render.all();return false">Lorries &amp; Workshop → Fuel log</a>.</div>';
    else{
      h+=VIZ.barsH('fu', fc.map(r=>({label:r.plate, total: Math.round((anyFuel? r.cost : r.estCost)*100)/100,
        note:(anyFuel? r.fills+' fills · '+Math.round(r.litres)+' L' : 'estimated at '+r.lPer100+' L/100km, '+r.source)+
             ' · '+Math.round(r.km).toLocaleString()+' km'})),
        {money:true, padL:100, aria:'Fuel cost per lorry'});
      if(!anyFuel) h+='<div class="tiny muted" style="margin-top:10px">These are estimates: distance × the lorry\'s consumption × '+
        Pay.money(FuelLog.price())+' a litre. Log real fills and this chart switches to what you actually spent.</div>';
    }
    h+='</div></div>';

    const effRows=fuelRows.filter(r=>r.lPer100>0).sort((a,b)=>b.lPer100-a.lPer100);
    if(effRows.length){
      h+='<div class="card" style="margin-bottom:16px"><div class="hd"><h3>Fuel used per 100 km</h3>'+
        '<span class="tiny muted" style="margin-left:auto">thirstiest first · measured figures only where two full tanks exist</span></div>'+
        '<div class="bd">'+
        VIZ.barsH('ef', effRows.map(r=>({label:r.plate+(r.measured?'':' *'), total:r.lPer100,
          note:r.source+' · fuel costs about '+Pay.money(r.lPer100/100*FuelLog.price())+' a km'})),
          {unit:'L', padL:110, aria:'Litres per 100 km per lorry'})+
        (effRows.some(r=>!r.measured)? '<div class="tiny muted" style="margin-top:10px">'+
          '* not yet measured — the fleet default or the figure set on the lorry. Two full-tank fills with odometer readings replace it.</div>':'')+
        '</div></div>';
    }

    /* --- per lorry --- */
    const vrows=veh.slice().sort((a,b)=> SUB.vmetric==='km'? b.km-a.km : b.trips-a.trips);
    h+='<div class="card"><div class="hd"><h3>Per lorry</h3>'+
      '<div style="margin-left:auto">'+seg('vmetric',SUB.vmetric,['km|Distance','trips|Trips'])+'</div></div><div class="bd">';
    if(!vrows.length) h+='<div class="empty">No distance or trips attributed to a lorry in this period. '+
      'A job counts once it has a date, an assigned driver, and addresses that can be placed.</div>';
    else{
      h+=VIZ.barsH('vh', vrows.map(r=>({label:r.plate, total: SUB.vmetric==='km'? r.km : r.trips,
        note:(r.type||'')+(r.estimated? ' · '+r.estimated+' of '+r.trips+' trips estimated':'')})),
        {unit: SUB.vmetric==='km'?'km':'trips', padL:100, aria:'Per lorry '+SUB.vmetric});
      const anyEst=vrows.some(r=>r.estimated>0);
      if(anyEst) h+='<div class="tiny muted" style="margin-top:10px">Distances marked estimated come from the addresses, not from a tracker — '+
        'good for comparing lorries against each other, not for billing.</div>';
    }
    h+='</div></div>';

    /* --- the table the charts are drawn from --- */
    if(SUB.table){
      h+='<div class="card" style="margin-top:16px"><div class="hd"><h3>Figures behind the charts</h3></div><div class="bd scroll">'+
        '<table class="tbl"><thead><tr><th>Driver</th><th class="num">Shifts</th><th class="num">Hours</th>'+
        '<th class="num">Normal</th><th class="num">Overtime</th></tr></thead><tbody>'+
        hrs.map(r=>'<tr><td>'+esc(r.name)+'</td><td class="num">'+r.days+'</td><td class="num">'+r.total+'</td>'+
          '<td class="num">'+r.normal+'</td><td class="num">'+(r.ot||'')+'</td></tr>').join('')+
        '</tbody></table>'+
        '<table class="tbl" style="margin-top:16px"><thead><tr><th>Lorry</th><th>Type</th><th class="num">Trips</th>'+
        '<th class="num">Distance (km)</th><th class="num">Measured</th><th class="num">Estimated</th></tr></thead><tbody>'+
        veh.map(r=>'<tr><td><b>'+esc(r.plate)+'</b></td><td class="tiny">'+esc(r.type)+'</td>'+
          '<td class="num">'+r.trips+'</td><td class="num">'+r.km+'</td>'+
          '<td class="num">'+r.measured+'</td><td class="num">'+r.estimated+'</td></tr>').join('')+
        '</tbody></table>'+
        '<table class="tbl" style="margin-top:16px"><thead><tr><th>Cost</th><th class="num">Amount</th><th class="num">Share</th></tr></thead><tbody>'+
        oc.parts.map(p=>'<tr><td>'+esc(p.name)+'</td><td class="num">'+Pay.money(p.value)+'</td>'+
          '<td class="num">'+(oc.total? Math.round(p.value/oc.total*100)+'%':'—')+'</td></tr>').join('')+
        '<tr style="font-weight:700"><td>Total</td><td class="num">'+Pay.money(oc.total)+'</td><td class="num">100%</td></tr>'+
        '</tbody></table>'+
        '<table class="tbl" style="margin-top:16px"><thead><tr><th>Period</th><th class="num">'+esc(mname)+'</th></tr></thead><tbody>'+
        series.map(b=>'<tr><td>'+esc(b.full)+'</td><td class="num">'+b.value+'</td></tr>').join('')+
        '</tbody></table></div></div>';
    }

    $('#view').innerHTML=h;
    VIZ.wire();

function expCell(d){
  if(!d) return '<td class="tiny muted">—</td>';
  const n=daysBetween(todayISO(), d);
  const cls = n<0? 'bad' : n<=14? 'bad' : n<=(S.settings.expiryWarnDays||45)? 'warn' : '';
  return '<td class="tiny">'+esc(d)+(cls? ' <span class="pill '+cls+'">'+(n<0?'expired':n+'d')+'</span>':'')+'</td>';
}
function kpi(k,v,s,cls){ return '<div class="kpi '+(cls||'')+'"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div><div class="s">'+esc(s||'')+'</div></div>'; }
function fld(label,input,cls){ return '<div class="f-item '+(cls||'')+'"><label class="f">'+esc(label)+'</label>'+input+'</div>'; }
/* shift <select> grouped by regular job; shifts that do not run on `date` are marked */
/* lorries that could take this shift, with the ones already committed marked */
function lorryOptions(date, shiftId, did, selected){
  const sh=shiftById(shiftId);
  const used=Fleet.usedOn(date, shiftId, did);
  let out='<option value="">— no lorry —</option>';
  const rank=v=>{
    if(Fleet.downOn(v.id,date)) return 3;
    if(used[v.id]) return 2;
    if(!Fleet.fits(v,sh)) return 1;
    return 0;
  };
  Fleet.live().slice().sort((a,b)=> rank(a)-rank(b) || String(a.plate).localeCompare(String(b.plate))).forEach(v=>{
    const down=Fleet.downOn(v.id,date);
    const tag = down? ' — off the road ('+down.reason+')'
              : used[v.id]? ' — '+used[v.id]+' has it this shift'
              : !Fleet.fits(v,sh)? ' — '+(v.type||'other')+', shift wants '+sh.vehType
              : (v.type? ' ('+v.type+')':'');
    out+='<option value="'+v.id+'"'+(selected===v.id?' selected':'')+'>'+esc(v.plate)+esc(tag)+'</option>';
  });
  return out;
}
function groupedShiftOptions(selected, date){
  let out='';
  activeContracts().forEach(c=>{
    const list=shiftsOfContract(c.id); if(!list.length) return;
    const runs = date? runsOn(c,date) : true;
    out+='<optgroup label="'+esc(c.name)+(date&&!runs? ' — not scheduled on '+DOW[dow(date)] : '')+'">';
    list.forEach(sh=> out+='<option value="'+sh.id+'"'+(selected===sh.id?' selected':'')+'>'+
      esc(sh.name)+' ('+sh.start+'–'+sh.end+')</option>');
    out+='</optgroup>';
  });
  const orphans=(S.settings.shifts||[]).filter(sh=>!contractById(sh.job));
  if(orphans.length){ out+='<optgroup label="Other">'+orphans.map(sh=>'<option value="'+sh.id+'"'+
    (selected===sh.id?' selected':'')+'>'+esc(sh.name)+'</option>').join('')+'</optgroup>'; }
  return out;
}

  offerSwap(date, coverDid, forDid){
    const a=S.drivers[coverDid], b=S.drivers[forDid];
    const wasOff = (entry(date,coverDid)||{}).creditFromOff;
    if(!wasOff){ return; }
    const ws=weekStartOf(date); let sameWeek=null;
    for(let i=1;i<=14;i++){ const d2=addDays(date,i); if(weekStartOf(d2)!==ws) break;
      const eA=entry(d2,coverDid), eB=entry(d2,forDid);
      if(eB&&eB.t==='O'&&eA&&(eA.t==='D'||eA.t==='S')&&!eA.cover){ sameWeek=d2; break; } }
    const wh=Rules.weekHours(coverDid,date), norm=S.settings.maxWeeklyHours;
    UI.open('Return the off day',
      '<p style="margin:0 0 12px"><b>'+esc(a.name)+'</b> gave up his rest day to cover <b>'+esc(b.name)+'</b>. '+
      'Take <b>'+esc(b.name)+'</b>\'s next off day and give it to <b>'+esc(a.name)+'</b> — they swap, headcount stays the same.</p>'+
      (sameWeek
        ? '<div class="alert ok"><b>'+esc(fmtDay(sameWeek))+'</b> is in the same week, so '+esc(a.name)+'\'s weekly hours stay at '+wh+'h — no overtime to pay'+

        : '<div class="alert warn">No swap available inside this week, so '+esc(a.name)+' books '+wh+'h ('+Math.max(0,wh-norm)+'h over the '+norm+'h norm) and takes the day back next week. The hours are owed either way — a same-week swap is the only version that costs nothing.</div>')+
      '<div class="tiny muted">You can also settle it later from <b>Cover &amp; Credits</b>.</div>',
      '<button class="btn" onclick="UI.close()">Settle later</button>'+

  assignJob(id){
    const j=S.jobs[id]; const cov=Rules.coverage(j.date);
    const rows=[];
    shiftsOn(j.date).forEach(sh=>{ const c=cov[sh.id]||{names:[],sbNames:[]};
      c.sbNames.forEach(did=> rows.push({did, sh, role:'Standby'}));
      c.names.forEach(did=> rows.push({did, sh, role:'On duty'}));
    });
    let b='<div class="tiny muted" style="margin-bottom:10px"><b>'+esc(j.title)+'</b> · '+esc((j.urgency||'normal').toUpperCase())+' · '+fmtDay(j.date)+
      '<br>Collect: '+esc(j.pickup||'—')+(j.pickupWindow?' by '+esc(j.pickupWindow):'')+
      ' → Deliver: '+esc(j.dropoff||j.address||'—')+(j.window?' ('+esc(j.window)+')':'')+
      '<br>Standby drivers are listed first — pull one onto an urgent drop and the low-priority work he was holding can wait.</div>';
    if(!rows.length) b+='<div class="empty">Nobody rostered on that date.</div>';
    rows.forEach(r=>{ const d=S.drivers[r.did]; if(!d) return;
      const load=Object.values(S.jobs).filter(x=>x.assigned===r.did&&x.date===j.date&&x.status!=='done').length;
      b+='<div class="cand'+(r.role==='Standby'?' best':'')+'" data-did="'+r.did+'"><div>'+
        '<div class="cn">'+esc(d.name)+' <span class="pill '+(r.role==='Standby'?'standby':'duty')+'">'+r.role+'</span></div>'+
        '<div class="cm"><span>'+esc(r.sh.name)+' '+r.sh.start+'–'+r.sh.end+'</span><span>'+esc(d.vehicle||'no vehicle')+'</span><span>'+load+' job(s) on hand</span></div>'+
        '</div></div>'; });
    UI.open('Assign delivery', b, '<button class="btn" onclick="UI.close()">Cancel</button>'+
      (j.assigned?'<button class="btn" id="_un">Unassign</button>':''), true);
    if($('#_un')) $('#_un').onclick=()=>{ Act.saveJob(Object.assign({},j,{assigned:''})); UI.close(); };

      UI.close(); toast('Assigned to '+S.drivers[el.dataset.did].name); });
  },

  swapVehicle(did, date){
    const d=S.drivers[did]; if(!d) return;
    const e=entry(date,did)||{}, sh=shiftById(e.shift);
    const curId=Fleet.vehicleFor(date,did), cur=Fleet.byId(curId);
    const down=curId? Fleet.downOn(curId,date):null;
    const used=Fleet.usedOn(date, e.shift, did);
    const pool=Fleet.live().filter(v=>v.id!==curId);
    let b='<p style="margin:0 0 10px"><b>'+esc(d.name)+'</b> · '+esc(fmtDay(date))+
      (sh? ' · '+esc(sh.name)+' '+sh.start+'–'+sh.end : '')+'<br>'+
      (cur? 'Currently on <b>'+esc(cur.plate)+'</b>'+(down? ' — off the road, '+esc(down.reason):'') : 'No lorry allocated')+'.</p>'+
      '<div class="tiny muted" style="margin-bottom:12px">This changes the lorry for this shift only. His usual lorry on the driver record stays as it is.</div>';
    if(!pool.length) b+='<div class="empty">No other lorry in the register.</div>';
    const rank=v=> Fleet.downOn(v.id,date)?3 : used[v.id]?2 : !Fleet.fits(v,sh)?1 : 0;
    pool.sort((a,b2)=> rank(a)-rank(b2) || String(a.plate).localeCompare(String(b2.plate)));
    pool.forEach(v=>{
      const dn=Fleet.downOn(v.id,date), clash=used[v.id], badType=!Fleet.fits(v,sh);
      const good=!dn&&!clash&&!badType;
      b+='<div class="cand'+(good?' best':'')+'" data-vid="'+v.id+'"><div>'+
        '<div class="cn">'+esc(v.plate)+' <span class="pill neutral">'+esc(v.type||'')+'</span>'+
          (v.id===d.vehicleId? ' <span class="pill duty">his usual</span>':'')+'</div>'+
        '<div class="cm"><span>'+esc(v.model||'')+'</span><span>'+(v.odo?Number(v.odo).toLocaleString()+' km':'')+'</span>'+
        (dn? '<span style="color:var(--bad)">⚠ off the road — '+esc(dn.reason)+'</span>'
          : clash? '<span style="color:var(--bad)">⚠ '+esc(clash)+' has it on an overlapping shift</span>'
          : badType? '<span style="color:var(--warn)">⚠ this shift asks for '+esc(sh.vehType)+'</span>'
          : '<span style="color:var(--ok)">✓ free for this shift</span>')+'</div></div></div>';
    });
    UI.open('Lorry for '+d.name, b,
      '<button class="btn" onclick="UI.close()">Cancel</button>'+
      (curId? '<button class="btn" id="_clr">Leave him without one</button>':'')+
      (cur? '<button class="btn" id="_perm">Make it his usual lorry</button>':''), true);
    if($('#_clr')) $('#_clr').onclick=()=>{ Act.setEntry(date,did,{veh:null}); UI.close(); Render.all(); };
    if($('#_perm')) $('#_perm').onclick=()=>{ Act.saveDriver(Object.assign({},d,{vehicleId:curId, vehicle:Fleet.plate(curId)}));
      UI.close(); toast(Fleet.plate(curId)+' is now '+d.name+'\'s usual lorry'); };
    $$('#mdlBody .cand').forEach(el=> el.onclick=()=>{
      const vid=el.dataset.vid;
      if(!e.t) Act.setEntry(date,did,{t:'D', shift:(e.shift||(shiftsOn(date)[0]||{}).id), veh:vid});
      else Act.setEntry(date,did,{veh:vid});
      UI.close(); Render.all(); toast(d.name+' → '+Fleet.plate(vid)+' for '+fmtDay(date));
    });
  },

        box.innerHTML='<span class="muted">Paste here…</span>';

      $('#_pgo').disabled=false;
    });
    box.onclick=()=>box.focus();
    setTimeout(()=>box.focus(),100);

  applyVehicles(makeDrivers, forceOdo){
    const plan=Flow._plan; if(!plan) return;
    if(forceOdo) plan.rows.forEach(r=>{ if(r.suspectOdo){ r.rec.odo=r.suspectOdo; } });
    const writes=[]; let created=0, updated=0, linked=0, newDrivers=0;
    const madeDriver={};
    plan.rows.forEach(r=>{
      const id = r.existing? r.existing.id : uid('veh');
      const base = r.existing? Object.assign({},r.existing) : {id, status:'active',
        serviceEveryKm:S.settings.serviceEveryKm, serviceEveryMonths:S.settings.serviceEveryMonths,
        roadTaxExp:'', insuranceExp:'', inspectionExp:'', lastServiceOdo:'', lastServiceDate:'', notes:'', odo:0};
      const next=Object.assign(base, r.rec, {id});
      if(r.existing) next.plate=r.existing.plate;   // keep a plate the planner has corrected
      if(r.rec.odo>0){ next.odoSource='imported reading'; next.odoSetAt=todayISO(); }
      if(r.existing && r.existing.odo && !r.rec.odo) next.odo=r.existing.odo;   // never lose a known odometer
      writes.push(['vehicles/'+id, next]);
      r.existing? updated++ : created++;
      // driver link
      let d=r.driver;
      if(!d && r.driverIsSet && makeDrivers){
        const key=norm(r.driverName).toLowerCase();
        if(madeDriver[key]) d=madeDriver[key];
        else { const did=uid('dr');
          d={id:did, name:r.driverName, empNo:'', phone:'', licence:'', shiftPref:'any',
             preferredOff:'', openingBalance:0, active:true};
          madeDriver[key]=d; newDrivers++;
        }
      }
      if(d){ writes.push(['drivers/'+d.id, Object.assign({}, S.drivers[d.id]||d, {vehicleId:id, vehicle:r.reg})]); linked++; }
    });
    writes.push(['meta/lastVehicleImport', new Date().toLocaleString()]);
    DB.putMany(writes);
    UI.close(); VIEW='fleet'; SUB.fleetTab='vehicles'; Render.all();
    toast(created+' added, '+updated+' updated'+(linked?', '+linked+' driver link(s)':'')+(newDrivers?', '+newDrivers+' new driver(s)':''));
  },

  exportStats(){
    const {from,to,buckets}=Stats.span(SUB.gran||'day', MONTH);
    const hrs=Stats.driverHours(from,to), veh=Stats.vehicleStats(from,to);
    const metric=SUB.metric||'km';
    const series=Stats.series(SUB.gran||'day', MONTH, metric);
    const out=[['Report '+from+' to '+to],[],
      ['WORKING HOURS PER DRIVER'],['Driver','Shifts','Total hours','Within '+(S.settings.maxWeeklyHours||44)+'h','Overtime']];
    hrs.forEach(r=> out.push([r.name, r.days, r.total, r.normal, r.ot]));
    out.push([]); out.push(['PER LORRY']);
    out.push(['Lorry','Type','Trips','Distance (km)','Trips measured','Trips estimated']);
    veh.forEach(r=> out.push([r.plate, r.type, r.trips, r.km, r.measured, r.estimated]));
    const fm2=OpCost.fuelMode(from,to);
    const oc2=OpCost.total(from,to,fm2), ou2=OpCost.unit(from,to,fm2);
    out.push([]); out.push(['OPERATING COST']);
    out.push(['Component','Amount','Share']);
    oc2.parts.forEach(p=> out.push([p.name, round2(p.value), oc2.total? Math.round(p.value/oc2.total*100)+'%':'']));
    out.push(['Total', round2(oc2.total), '100%']);
    out.push(['Cost per km', ou2.perKm!=null? round2(ou2.perKm):'', '']);
    out.push(['Cost per trip', ou2.perTrip!=null? round2(ou2.perTrip):'', '']);
    out.push(['Excludes CPF, levies, insurance, road tax, parking, ERP and finance']);
    out.push([]); out.push(['FUEL']);
    out.push(['Lorry','Fills','Litres','Cost','Distance (km)','L/100km','Basis']);
    veh.forEach(r=>{ const t=FuelLog.totals(from,to).byVehicle[r.id]||{cost:0,litres:0,fills:0};
      const c=FuelLog.consumption(r.id);
      out.push([r.plate, t.fills, round2(t.litres), round2(t.cost), r.km, c.lPer100, c.source]); });
    out.push([]); out.push(['SUGGESTED CHANGES']);
    Balance.suggest(from,to).forEach(x=> out.push([x.level, x.title, x.detail]));
    out.push([]); out.push([({km:'DISTANCE',trips:'TRIPS',hours:'WORKING HOURS',fuel:'FUEL COST',cost:'OPERATING COST'}[metric])+' OVER TIME']);
    out.push(['Period','Value']);
    series.forEach(b=> out.push([b.full, b.value]));
    download('report-'+from+'-to-'+to+'.csv', toCSV(out), 'text/csv');
  },
