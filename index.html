/* --------------------- vehicle list import ------------------------- */
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  text=String(text).replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); cur=''; rows.push(row); row=[]; }
    else if(c==='\r'){}
    else cur+=c;
  }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
const norm = x => String(x==null?'':x).replace(/\s+/g,' ').trim();
const plateKey = x => norm(x).toUpperCase().replace(/[^A-Z0-9]/g,'');
/* a real plate has both letters and digits — keeps "Total: 19 vehicles" out of the register */
const looksLikePlate = k => /[A-Z]/.test(k) && /[0-9]/.test(k) && k.length>=4 && k.length<=12;

/* Some exports put everything in one cell: "GBK8363T (Van) GBK8363T", where the
   trailing token is the registration proper. Take the last plate-like token and
   ignore anything in brackets (otherwise "(24FT)" reads as a plate). */
function platesInName(name){
  return norm(name).split(/\s+/)
    .filter(t=>!/^\(.*\)$/.test(t))
    .map(plateKey)
    .filter(looksLikePlate);
}
/* Turn "GBL7215P (E-Van)" / "YQ1211R (24FT)" into a readable body type */
function typeFromName(name){
  const m=String(name||'').match(/\(([^)]+)\)/);
  if(!m) return '';
  const t=norm(m[1]);
  if(/^e-?van$/i.test(t)) return 'Electric van';
  if(/^van$/i.test(t)) return 'Van';
  const ft=t.match(/^(\d+)\s*ft$/i);
  if(ft) return ft[1]+'ft lorry';
  return t;
}
const LIVE={'driving':{label:'Driving',cls:'ok'},'stationary':{label:'Stationary',cls:'neutral'},
  'idling':{label:'Idling',cls:'warn'},'ignition off':{label:'Ignition off',cls:'neutral'}};

/* Build an import plan from a telematics export. Nothing is written until it is applied. */
/* A table copied out of the Cartrack portal arrives as HTML on the clipboard —
   parse that properly rather than guessing at delimiters. */
function parseClipboardTable(html){
  try{
    const doc=new DOMParser().parseFromString(html,'text/html');
    const table=doc.querySelector('table'); if(!table) return null;
    const rows=[];
    Array.from(table.querySelectorAll('tr')).forEach(tr=>{
      const cells=Array.from(tr.querySelectorAll('th,td')).map(td=> norm(td.textContent));
      if(cells.some(c=>c!=='')) rows.push(cells);
    });
    return rows.length? rows : null;
  }catch(e){ return null; }
}
/* Plain-text paste: tabs if the source used them, otherwise fall back to CSV rules */
function parsePastedText(text){
  const lines=String(text).replace(/\r/g,'').split('\n').filter(l=>l.trim()!=='');
  if(!lines.length) return [];
  if(lines[0].indexOf('\t')>=0) return lines.map(l=>l.split('\t').map(norm));
  return parseCSV(text);
}
function buildVehiclePlan(text){
  return buildVehiclePlanFromRows(parseCSV(text));
}
function buildVehiclePlanFromRows(rows){
  if(!rows || !rows.length) return {error:'Nothing to read — no rows found.'};
  const head=rows[0].map(h=>norm(h).toLowerCase());
  const col=(...names)=>{ for(const n of names){ const i=head.indexOf(n); if(i>=0) return i; }
    for(const n of names){ const i=head.findIndex(h=>h.indexOf(n)>=0); if(i>=0) return i; } return -1; };
  const iReg=col('registration','reg no','plate','vehicle registration');
  const iName=col('vehicle name','name','vehicle');
  if(iReg<0 && iName<0) return {error:'No "Registration" or "Vehicle Name" column found. Columns seen: '+rows[0].join(' | ')};
  const iGrp=col('groups','group','fleet','contract'), iSt=col('status'), iDrv=col('driver'),
        iScore=col('score'), iEng=col('engine type','engine'), iSpd=col('speed'),
        iLoc=col('location','last location'), iGeo=col('current geofence','geofence'),
        iOdo=col('current odometer','odometer','odo','mileage','miliage','milage','mileage (km)','distance','km');
  const byPlate={}; Object.values(S.vehicles).forEach(v=> byPlate[plateKey(v.plate)]=v);
  const drvByName={}; Object.values(S.drivers).forEach(d=> drvByName[norm(d.name).toLowerCase()]=d);

  const plan={rows:[], create:0, update:0, warnings:[], unknownDrivers:[], stamp:new Date().toISOString(),
    hasOdoColumn: iOdo>=0, odoCount:0,
    emptyColumns: rows[0].map((h,i)=>({h:norm(h), i}))
      .filter(c=>c.h && rows.slice(1).every(r=> !norm(r[c.i]))).map(c=>c.h)};
  const seen={};
  rows.slice(1).forEach((r,n)=>{
    const get=i=> i>=0? norm(r[i]) : '';
    const name=get(iName);
    const inName=platesInName(name);
    /* the export appends the registration after the name, so the LAST plate wins */
    const reg=get(iReg) || (inName.length? inName[inName.length-1] : name.split(' ')[0]);
    if(!reg) return;
    const key=plateKey(reg);
    if(!looksLikePlate(key)) return;              // summary / total / blank row
    if(seen[key]){ plan.warnings.push('Row '+(n+2)+': '+reg+' appears more than once — the last row wins.'); }
    seen[key]=1;
    // registration vs the plate embedded in the vehicle name
    if(inName.length>1 && inName[0]!==key)
      plan.warnings.push('Row '+(n+2)+': the name starts "'+inName[0]+'" but the registration is "'+reg+'" — importing as '+reg+'.');
    else{
      const namePlate=name.split('(')[0];
      if(namePlate && plateKey(namePlate) && looksLikePlate(plateKey(namePlate)) && plateKey(namePlate)!==key)
        plan.warnings.push('Row '+(n+2)+': name says "'+norm(namePlate)+'" but registration says "'+reg+'" — importing as '+reg+'.');
    }
    const existing=byPlate[key]||null;
    const drvName=get(iDrv);
    const driverIsSet = drvName && !/^unassigned$/i.test(drvName) && drvName!=='-';
    let driver=null;
    if(driverIsSet){
      driver=drvByName[drvName.toLowerCase()]||null;
      if(!driver && plan.unknownDrivers.indexOf(drvName)<0) plan.unknownDrivers.push(drvName);
    }
    const live=get(iSt);
    const rec={
      plate:reg,
      type: typeFromName(name) || (existing? existing.type : ''),
      model: get(iEng) || (existing? existing.model : ''),
      group: get(iGrp),
      liveStatus: live,
      liveSpeed: get(iSpd),
      liveLocation: get(iLoc),
      geofence: get(iGeo),
      score: get(iScore),
      lastSeen: plan.stamp
    };
    const odo=get(iOdo);
    if(odo && !isNaN(Number(odo.replace(/[^0-9.]/g,'')))){
      const n=Number(odo.replace(/[^0-9.]/g,''));
      if(n>0){ rec.odo=n; plan.odoCount++; }
    }
    plan.rows.push({reg, key, name, rec, existing, driverName:drvName, driverIsSet, driver,
      action: existing? 'update':'create'});
    if(existing) plan.update++; else plan.create++;
  });
  /* An odometer is the one field where a wrong number does lasting damage — it
     drives the service schedule and every cost-per-km figure. So sanity-check
     the batch against itself and against what is already on record, and hold
     back anything that cannot be true rather than writing it and hoping. */
  const vals=plan.rows.map(r=>r.rec.odo).filter(v=>v>0).sort((x,y)=>x-y);
  const median=vals.length? vals[Math.floor(vals.length/2)] : 0;
  plan.odoFlags=[];
  plan.rows.forEach(r=>{
    const n=r.rec.odo; if(!(n>0)) return;
    let reason=null;
    if(median>0 && n > median*5)
      reason='reads '+Math.round(n/median)+'× the fleet median of '+Math.round(median).toLocaleString()+' km';
    else if(r.existing && Number(r.existing.odo)>0 && n < Number(r.existing.odo))
      reason='lower than the '+Number(r.existing.odo).toLocaleString()+' km already on record';
    else if(r.existing && Number(r.existing.odo)>0 && r.existing.lastSeen){
      const days=Math.max(1, daysBetween(String(r.existing.lastSeen).slice(0,10), plan.stamp.slice(0,10)));
      const perDay=(n-Number(r.existing.odo))/days;
      if(perDay>1500) reason=Math.round(perDay).toLocaleString()+' km a day since the last reading';
    }
    if(reason){
      plan.odoFlags.push({reg:r.reg, value:n, reason});
      r.suspectOdo=n; delete r.rec.odo; plan.odoCount--;
    }
  });
  return plan;
}
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
function toCSV(rows){ return rows.map(r=>r.map(c=>{ const s=String(c==null?'':c);
  return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; }).join(',')).join('\n'); }
function download(name, text, type){
  const b=new Blob([text],{type:type||'text/plain'}), u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); },500);
}
