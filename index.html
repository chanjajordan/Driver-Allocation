<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver Allocation &middot; 24h Fleet Roster Planner</title>
<style>
:root{
  --bg:#f1f4f9; --panel:#ffffff; --panel-2:#f7f9fc; --line:#dde3ec; --line-2:#eaeff6;
  --ink:#16202e; --ink-2:#54637a; --ink-3:#8a97ab;
  --brand:#2f5fe0; --brand-ink:#ffffff; --brand-soft:#e7edfd;
  --duty:#2f5fe0; --duty-bg:#e7edfd;
  --standby:#b8730a; --standby-bg:#fdf0dc;
  --off:#6b7688; --off-bg:#eef1f6;
  --mc:#c62b3f; --mc-bg:#fde8ea;
  --leave:#7a44c9; --leave-bg:#f1e9fd;
  --ok:#127a52; --ok-bg:#e2f5ee;
  --warn:#b8730a; --warn-bg:#fdf0dc;
  --bad:#c62b3f; --bad-bg:#fde8ea;
  --shadow:0 1px 2px rgba(16,28,48,.06),0 6px 20px rgba(16,28,48,.06);
  --r:10px;
}
html[data-theme="dark"]{
  --bg:#0e1420; --panel:#151d2b; --panel-2:#1b2534; --line:#28344a; --line-2:#212c3e;
  --ink:#e8eef8; --ink-2:#9fb0c8; --ink-3:#6f8099;
  --brand:#5b8bff; --brand-ink:#0b1220; --brand-soft:#1c2b4d;
  --duty:#7ba4ff; --duty-bg:#1c2b4d;
  --standby:#e6a33c; --standby-bg:#3a2d15;
  --off:#8b98ac; --off-bg:#222c3d;
  --mc:#ff7183; --mc-bg:#3d1c23;
  --leave:#b48cf5; --leave-bg:#2c1f45;
  --ok:#4bd0a0; --ok-bg:#123328;
  --warn:#e6a33c; --warn-bg:#3a2d15;
  --bad:#ff7183; --bad-bg:#3d1c23;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--brand)}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{width:216px;flex:0 0 216px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:16px 16px 12px;border-bottom:1px solid var(--line-2)}
.brand .logo{display:flex;align-items:center;gap:9px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--brand);color:var(--brand-ink);
  display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 auto}
.brand .nm{font-weight:700;font-size:14px;line-height:1.15}
.brand .sub{font-size:11px;color:var(--ink-3);margin-top:2px}
.nav{padding:8px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;
  padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:550}
.nav button:hover{background:var(--panel-2);color:var(--ink)}
.nav button.on{background:var(--brand-soft);color:var(--brand);font-weight:650}
.nav .ic{width:16px;text-align:center;font-size:14px}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--bad-bg);color:var(--bad);
  padding:1px 6px;border-radius:99px;font-weight:700}
.sidefoot{padding:10px;border-top:1px solid var(--line-2);font-size:11px;color:var(--ink-3)}
.syncdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink-3);margin-right:6px}
.syncdot.live{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.syncdot.local{background:var(--warn)}
.syncdot.err{background:var(--bad)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);
  padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:17px}
.top .spacer{flex:1}
.wrap{padding:20px;max-width:1500px;width:100%}

/* ---------- controls ---------- */
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;
  cursor:pointer;font-weight:600;color:var(--ink);white-space:nowrap;transition:.12s}
.btn:hover{border-color:var(--ink-3)}
.btn.p{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.p:hover{filter:brightness(1.07)}
.btn.d{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.gh{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.gh:hover{background:var(--panel-2);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=password],select,textarea{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
label.f{display:block;font-size:11px;font-weight:650;color:var(--ink-2);margin:0 0 4px;
  text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{min-width:0}
.grow{flex:1}
.row>.f-item{flex:1 1 165px;min-width:165px}   /* wrap onto the next line rather than crush */
@media(max-width:520px){ .row>.f-item{flex:1 1 100%;min-width:0} }

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card .hd{padding:12px 14px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.card .hd h3{font-size:14px}
.card .bd{padding:14px}
.grid{display:grid;gap:14px}
.muted{color:var(--ink-2)}
.tiny{font-size:11px}
.empty{padding:26px;text-align:center;color:var(--ink-3)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:700}
.kpi .v{font-size:26px;font-weight:750;letter-spacing:-.02em;margin-top:3px;line-height:1.1}
.kpi .s{font-size:11px;color:var(--ink-2);margin-top:2px}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;
  font-size:11px;font-weight:700;white-space:nowrap}
.pill.duty{background:var(--duty-bg);color:var(--duty)}
.pill.standby{background:var(--standby-bg);color:var(--standby)}
.pill.off{background:var(--off-bg);color:var(--off)}
.pill.mc{background:var(--mc-bg);color:var(--mc)}
.pill.leave{background:var(--leave-bg);color:var(--leave)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.neutral{background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line)}

/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);
  text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tbody tr:hover{background:var(--panel-2)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow:auto}

/* roster grid */
.rgrid{overflow:auto;max-height:calc(100vh - 250px)}
.rgrid table{border-collapse:separate;border-spacing:0}
.rgrid th,.rgrid td{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2)}
.rgrid thead th{position:sticky;top:0;z-index:5;background:var(--panel);padding:4px 3px;
  font-size:10px;color:var(--ink-3);text-align:center;min-width:34px}
.rgrid thead th.dow{font-weight:700}
.rgrid thead th.we{background:var(--panel-2);color:var(--ink-2)}
.rgrid th.nameh,.rgrid td.namec{position:sticky;left:0;z-index:4;background:var(--panel);
  text-align:left;min-width:170px;max-width:170px;padding:5px 9px}
.rgrid thead th.nameh{z-index:7}
.rgrid tbody tr:hover td.namec{background:var(--panel-2)}
.rgrid td.namec .dn{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rgrid td.namec .dm{font-size:10px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.cell{height:30px;text-align:center;cursor:pointer;font-size:10.5px;font-weight:750;
  user-select:none;position:relative;padding:0}
.cell:hover{outline:2px solid var(--brand);outline-offset:-2px;z-index:2}
.cell.c-D{background:var(--duty-bg);color:var(--duty)}
.cell.c-S{background:var(--standby-bg);color:var(--standby)}
.cell.c-O{background:var(--off-bg);color:var(--off)}
.cell.c-M{background:var(--mc-bg);color:var(--mc)}
.cell.c-L{background:var(--leave-bg);color:var(--leave)}
.cell.c-_{background:transparent;color:var(--ink-3)}
.cell.we{box-shadow:inset 0 0 0 99px rgba(120,130,150,.05)}
.cell.today{outline:2px solid var(--brand);outline-offset:-2px}
.cell .flag{position:absolute;top:1px;right:2px;font-size:8px;line-height:1}
.cell.cov::after{content:"";position:absolute;left:2px;bottom:2px;width:5px;height:5px;
  border-radius:50%;background:var(--mc)}
.cell.comp::after{content:"";position:absolute;left:2px;bottom:2px;width:5px;height:5px;
  border-radius:50%;background:var(--ok)}
.covrow td{background:var(--panel-2);font-size:10px;text-align:center;font-weight:700;height:22px}
.covrow td.namec{text-align:left;font-size:11px;color:var(--ink-2)}
.covrow td.short{background:var(--bad-bg);color:var(--bad)}
.covrow td.full{color:var(--ink-3)}

/* legend */
.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--ink-2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(10,18,32,.5);backdrop-filter:blur(2px);
  display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.ovl.on{display:flex}
.mdl{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);
  width:100%;max-width:620px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.mdl.wide{max-width:920px}
.mdl .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.mdl .mh h3{font-size:15px;flex:1}
.mdl .mb{padding:18px;overflow:auto}
.mdl .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;
  background:var(--panel-2)}
.x{background:none;border:0;font-size:20px;line-height:1;color:var(--ink-3);cursor:pointer;padding:0 4px}

/* candidate list */
.cand{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:12px;
  align-items:center;margin-bottom:8px;cursor:pointer;background:var(--panel)}
.cand:hover{border-color:var(--brand);background:var(--brand-soft)}
.cand.best{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-bg)}
.cand .cn{font-weight:650}
.cand .cm{font-size:11px;color:var(--ink-2);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.cand .score{margin-left:auto;text-align:right}
.cand .score b{font-size:16px}

/* job board */
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.job{border:1px solid var(--line);border-left:3px solid var(--off);border-radius:10px;padding:11px 12px;background:var(--panel)}
.job.u-urgent{border-left-color:var(--bad)}
.job.u-normal{border-left-color:var(--brand)}
.job.u-low{border-left-color:var(--off)}
.job.done{opacity:.55}
.job .jt{font-weight:650;font-size:13.5px}
.job .jm{font-size:11px;color:var(--ink-2);margin-top:3px}
.job .ja{margin-top:9px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;
  z-index:200;opacity:0;transition:.25s;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--ink-2);
  font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}

.alert{padding:10px 12px;border-radius:9px;font-size:12.5px;display:block;margin-bottom:8px;line-height:1.5}
.alert code{background:rgba(125,135,155,.18);padding:1px 5px;border-radius:4px;font-size:11.5px}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
.alert b{font-weight:750}
.hidden{display:none!important}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.bar i.short{background:var(--bad)}
.bar i.full{background:var(--ok)}

/* ---- charts: validated categorical palette (blue / orange), both modes ---- */
.viz, .vlegend{ color-scheme:light;
  --surface-1:#fcfcfb; --v-ink:#0b0b0b; --v-ink-2:#52514e; --v-muted:#898781;
  --v-grid:#e1e0d9; --v-axis:#c3c2b7;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; }
@media (prefers-color-scheme: dark){
  html:not([data-theme="light"]) .viz, html:not([data-theme="light"]) .vlegend{ color-scheme:dark;
    --surface-1:#1a1a19; --v-ink:#ffffff; --v-ink-2:#c3c2b7; --v-muted:#898781;
    --v-grid:#2c2c2a; --v-axis:#383835; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; }
}
html[data-theme="dark"] .viz, html[data-theme="dark"] .vlegend{ color-scheme:dark;
  --surface-1:#1a1a19; --v-ink:#ffffff; --v-ink-2:#c3c2b7; --v-muted:#898781;
  --v-grid:#2c2c2a; --v-axis:#383835; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; }
.viz{ background:var(--surface-1); border-radius:var(--r); }
.vlegend{ background:transparent }
.viz svg{ display:block; width:100%; height:auto; overflow:visible }
.viz .gl{ stroke:var(--v-grid); stroke-width:1; shape-rendering:crispEdges }
.viz .ax{ stroke:var(--v-axis); stroke-width:1; shape-rendering:crispEdges }
.viz .tk{ fill:var(--v-muted); font-size:10.5px; font-variant-numeric:tabular-nums }
.viz .lb{ fill:var(--v-ink-2); font-size:11.5px }
.viz .dv{ fill:var(--v-ink); font-size:11.5px; font-weight:650; font-variant-numeric:tabular-nums }
.viz rect.mk{ cursor:default }
.viz rect.mk:hover, .viz path.mk:hover{ opacity:.82 }
.vlegend{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; font-size:11.5px; color:var(--ink-2) }
.vlegend i{ width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:6px; vertical-align:-1px }
.vtip{ position:fixed; z-index:300; pointer-events:none; background:var(--ink); color:var(--bg);
  padding:7px 10px; border-radius:8px; font-size:11.5px; line-height:1.5; opacity:0; transition:opacity .08s;
  box-shadow:0 6px 24px rgba(0,0,0,.28); max-width:240px }
.vtip.on{ opacity:1 }
.vtip b{ font-weight:700 }
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden }
.seg button{ background:var(--panel); border:0; padding:6px 11px; cursor:pointer; font-weight:600;
  color:var(--ink-2); font-size:12.5px; border-left:1px solid var(--line) }
.seg button:first-child{ border-left:0 }
.seg button.on{ background:var(--brand); color:var(--brand-ink) }
@media(max-width:820px){
  .side{position:fixed;left:-220px;transition:.2s;z-index:60}
  .side.open{left:0}
  .wrap{padding:14px}
  .menu-btn{display:inline-flex!important}
}
.menu-btn{display:none}
@media print{.side,.top,.noprint{display:none!important}.wrap{padding:0}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">
        <div class="mark">DA</div>
        <div><div class="nm" id="orgName">Driver Allocation</div><div class="sub">24h fleet roster planner</div></div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button data-v="today" class="on"><span class="ic">◉</span>Today</button>
      <button data-v="roster"><span class="ic">▦</span>Roster</button>
      <button data-v="regular"><span class="ic">◫</span>Regular Jobs</button>
      <button data-v="cover"><span class="ic">⇄</span>Cover &amp; Credits<span class="cnt hidden" id="navCover">0</span></button>
      <button data-v="jobs"><span class="ic">▤</span>Standby Jobs</button>
      <button data-v="fleet"><span class="ic">▬</span>Lorries &amp; Workshop<span class="cnt hidden" id="navFleet">0</span></button>
      <button data-v="owner"><span class="ic">★</span>Owner Summary</button>
      <button data-v="stats"><span class="ic">◎</span>Reports</button>
      <button data-v="cost"><span class="ic">$</span>Pay &amp; OT Cost</button>
      <button data-v="drivers"><span class="ic">☰</span>Drivers</button>
      <button data-v="settings"><span class="ic">⚙</span>Settings</button>
    </nav>
    <div class="sidefoot">
      <div><span class="syncdot" id="syncDot"></span><span id="syncTxt">Local only</span></div>
      <div class="seg" id="langSeg" style="margin-top:8px;width:100%">
        <button type="button" data-lang="en" style="flex:1">English</button>
        <button type="button" data-lang="zh" style="flex:1">中文</button>
      </div>
      <div style="margin-top:6px;display:flex;gap:6px">
        <button class="btn sm gh" id="themeBtn" title="Toggle theme">◐ Theme</button>
        <button class="btn sm gh" onclick="window.print()">⎙ Print</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="btn sm menu-btn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <h1 id="viewTitle">Today</h1>
      <div class="spacer"></div>
      <div id="topActions" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    </header>
    <div class="wrap" id="view"></div>
  </main>
</div>

<div class="ovl" id="ovl"><div class="mdl" id="mdl">
  <div class="mh"><h3 id="mdlTitle">Title</h3><button class="x" onclick="UI.close()">×</button></div>
  <div class="mb" id="mdlBody"></div>
  <div class="mf" id="mdlFoot"></div>
</div></div>
<div class="toast" id="toast"></div>
<div class="vtip" id="vtip"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
"use strict";
/* =====================================================================
   Driver Allocation — 24h fleet roster planner
   Single-file app. Optional Firebase Realtime Database sync.
   ===================================================================== */

/* ---------------------------- helpers ------------------------------ */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const uid = p => (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const pad2 = n => String(n).padStart(2,'0');

function iso(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function todayISO(){ return iso(new Date()); }
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
function dow(s){ return parseISO(s).getDay(); }
function isWeekend(s){ const d=dow(s); return d===0||d===6; }
function fmtDay(s){ const d=parseISO(s);
  if(LANG==='zh') return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 周'+DOW[d.getDay()];
  return DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()].slice(0,3)+' '+d.getFullYear(); }
function monthDays(y,m){ const out=[],d=new Date(y,m,1); while(d.getMonth()===m){ out.push(iso(d)); d.setDate(d.getDate()+1);} return out; }
/* week key: week starting on settings.weekStart (0=Sun,1=Mon) */
function weekStartOf(s){
  const ws = S.settings.weekStart|0, d=parseISO(s);
  let diff = d.getDay()-ws; if(diff<0) diff+=7;
  return addDays(s,-diff);
}
function hoursBetween(a,b){ // "08:00","20:00" -> 12 ; overnight handled
  const [ah,am]=a.split(':').map(Number), [bh,bm]=b.split(':').map(Number);
  let h=(bh*60+bm)-(ah*60+am); if(h<=0) h+=1440; return h/60;
}
function toast(msg,ms){ const t=$('#toast');
  const key=String(msg);
  const tr=(typeof I18N!=='undefined' && LANG==='zh')
    ? (I18N.blocks[key]!==undefined? I18N.blocks[key] : I18N.t(key)) : null;
  t.textContent = tr!==null && tr!==undefined ? tr : msg;
  t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'), ms||2600); }

/* ---- regular jobs (contracts) ----------------------------------------
   A regular job is a standing piece of work — a customer contract, a shuttle
   run, a night trunk. Each one carries its OWN shifts and its own running days,
   so a weekday 9-to-6 contract never drags night-shift headcount into the plan.
   Shifts stay in one flat list keyed by id (so every existing roster entry keeps
   working) and each shift records which regular job it belongs to. */
const contractById = id => (S.contracts && S.contracts[id]) || null;
function ensureContracts(){
  if(!S.contracts) S.contracts={};
  const shifts = S.settings.shifts || [];
  if(!Object.keys(S.contracts).length){
    const id='job_main';
    S.contracts[id]={ id, name:(S.settings.org && S.settings.org!=='Driver Allocation')? S.settings.org : 'Main operation',
      customer:'', colour:'#2f5fe0', days:[0,1,2,3,4,5,6], active:true, startDate:'', endDate:'', notes:'' };
    shifts.forEach(sh=>{ if(!sh.job) sh.job=id; });
    return true;                                   // caller persists the migration once
  }
  const first=Object.keys(S.contracts)[0];
  let changed=false;
  shifts.forEach(sh=>{ if(!sh.job || !S.contracts[sh.job]){ sh.job=first; changed=true; } });
  return changed;
}
function contractDays(c){ return (Array.isArray(c&&c.days) && c.days.length)? c.days : [0,1,2,3,4,5,6]; }
function runsOn(c, date){
  if(!c || c.active===false) return false;
  if(c.startDate && date < c.startDate) return false;
  if(c.endDate   && date > c.endDate)   return false;
  return contractDays(c).indexOf(dow(date))>=0;
}
/* the shifts that actually need manning on this date */
function shiftsOn(date){
  return (S.settings.shifts||[]).filter(sh=>{ const c=contractById(sh.job); return c? runsOn(c,date) : true; });
}
function activeContracts(){ return Object.values(S.contracts||{})
  .sort((a,b)=> (a.active===false)-(b.active===false) || (a.name||'').localeCompare(b.name||'')); }
function shiftsOfContract(id){ return (S.settings.shifts||[]).filter(sh=>sh.job===id); }
function contractOfShift(id){ const sh=shiftById(id); return sh? contractById(sh.job) : null; }
function contractLabel(id){ const c=contractById(id); return c? c.name : ''; }
function daysLabel(c){
  const d=contractDays(c).slice().sort();
  if(d.length===7) return 'Every day';
  if(d.join()==='1,2,3,4,5') return 'Mon–Fri';
  if(d.join()==='1,2,3,4,5,6') return 'Mon–Sat';
  if(d.join()==='0,6') return 'Weekends';
  return d.map(x=>DOW[x]).join(', ');
}

const shiftById = id => (S.settings.shifts||[]).find(s=>s.id===id) || null;
/* minutes-from-midnight window; an end at or before the start runs past midnight */
function shiftWindow(sh){
  if(!sh) return null;
  const [h1,m1]=String(sh.start||'0:0').split(':').map(Number);
  const [h2,m2]=String(sh.end||'0:0').split(':').map(Number);
  let a=h1*60+m1, b=h2*60+m2; if(b<=a) b+=1440;
  return [a,b];
}
function shiftsOverlap(a,b){
  if(!a||!b) return false;
  if(a.id && a.id===b.id) return true;
  const wa=shiftWindow(a), wb=shiftWindow(b); if(!wa||!wb) return false;
  const ov=(x1,x2,y1,y2)=> x1<y2 && y1<x2;
  return ov(wa[0],wa[1],wb[0],wb[1]) || ov(wa[0],wa[1],wb[0]+1440,wb[1]+1440) || ov(wa[0]+1440,wa[1]+1440,wb[0],wb[1]);
}
const shiftName = id => (shiftById(id)||{name:'—'}).name;
const shiftHours = id => { const s=shiftById(id); return s? hoursBetween(s.start,s.end):0; };
function activeDrivers(){ return Object.values(S.drivers).filter(d=>d.active!==false)
  .sort((a,b)=> (a.name||'').localeCompare(b.name||'')); }
function allDrivers(){ return Object.values(S.drivers).sort((a,b)=>
  (a.active===false)-(b.active===false) || (a.name||'').localeCompare(b.name||'')); }
function entry(date,did){ return (S.roster[date]||{})[did] || null; }
function code(date,did){ const e=entry(date,did); return e? e.t : '_'; }

function setAtPath(obj, path, value){
  const parts=path.split('/'); let o=obj;
  for(let i=0;i<parts.length-1;i++){ const k=parts[i]; if(typeof o[k]!=='object'||o[k]===null) o[k]={}; o=o[k]; }
  const last=parts[parts.length-1];
  if(value===null||value===undefined) delete o[last]; else o[last]=value;
}

/* --------------------------- rules engine --------------------------- */
const Rules = {
  /* hours worked in the ISO-ish week containing `date` for a driver */
  weekHours(did, date){
    const start=weekStartOf(date); let h=0;
    for(let i=0;i<7;i++){ const d=addDays(start,i), e=entry(d,did);
      if(e && (e.t==='D'||e.t==='S')) h+=shiftHours(e.shift); }
    return h;
  },
  weekDaysWorked(did,date){
    const start=weekStartOf(date); let n=0;
    for(let i=0;i<7;i++){ const e=entry(addDays(start,i),did); if(e&&(e.t==='D'||e.t==='S')) n++; }
    return n;
  },
  weekOffDays(did,date){
    const start=weekStartOf(date); let n=0;
    for(let i=0;i<7;i++){ const e=entry(addDays(start,i),did); if(e&&e.t==='O') n++; }
    return n;
  },
  monthHours(did,ym){ // ym {y,m}
    let h=0; monthDays(ym.y,ym.m).forEach(d=>{ const e=entry(d,did);
      if(e&&(e.t==='D'||e.t==='S')) h+=shiftHours(e.shift); }); return h;
  },
  monthOT(did,ym){
    // OT = sum over weeks of hours above the weekly normal, counting only days in this month's weeks
    const days=monthDays(ym.y,ym.m); const seen={}; let ot=0;
    days.forEach(d=>{ const ws=weekStartOf(d); if(seen[ws]) return; seen[ws]=1;
      ot += Math.max(0, this.weekHours(did,d) - S.settings.maxWeeklyHours); });
    return Math.round(ot*10)/10;
  },
  consecutiveDays(did,date){ // working days ending on `date` (inclusive)
    let n=0,d=date;
    for(let i=0;i<30;i++){ const e=entry(d,did); if(e&&(e.t==='D'||e.t==='S')){ n++; d=addDays(d,-1);} else break; }
    return n;
  },
  /* rest hours between previous assignment end and this shift start */
  restBefore(did,date,shiftId){
    const sh=shiftById(shiftId); if(!sh) return 99;
    const prev=entry(addDays(date,-1),did);
    if(!prev || (prev.t!=='D'&&prev.t!=='S')) return 99;
    const p=shiftById(prev.shift); if(!p) return 99;
    const [ph,pm]=p.end.split(':').map(Number); const [sh_h,sh_m]=sh.start.split(':').map(Number);
    let endMin=(ph*60+pm); const [pStartH,pStartM]=p.start.split(':').map(Number);
    if(endMin<=(pStartH*60+pStartM)) endMin+=1440;           // previous shift ended after midnight
    const startMin=1440+(sh_h*60+sh_m);                       // today's start, measured from prev day 00:00
    return Math.max(0,(startMin-endMin)/60);
  },
  /* coverage for one date */
  coverage(date){
    const out={};
    shiftsOn(date).forEach(sh=>{ out[sh.id]={duty:0,standby:0,req:sh.required|0,reqSb:sh.standby|0,names:[],sbNames:[],job:sh.job}; });
    const day=S.roster[date]||{};
    /* someone manually rostered onto a shift that does not normally run today
       still has to show up somewhere, so give that shift a zero-requirement slot */
    Object.keys(day).forEach(did=>{ const e=day[did];
      if((e.t==='D'||e.t==='S') && e.shift && !out[e.shift]){ const sh=shiftById(e.shift);
        out[e.shift]={duty:0,standby:0,req:0,reqSb:0,names:[],sbNames:[],job:sh?sh.job:null,offDay:true}; } });
    Object.keys(day).forEach(did=>{
      const e=day[did]; const d=S.drivers[did]; if(!d||d.active===false) return;
      if((e.t==='D'||e.t==='S') && out[e.shift]){
        if(e.t==='D'){ out[e.shift].duty++; out[e.shift].names.push(did); }
        else { out[e.shift].standby++; out[e.shift].sbNames.push(did); }
      }
    });
    return out;
  },
  dayGaps(date){
    const c=this.coverage(date), gaps=[];
    shiftsOn(date).forEach(sh=>{ const x=c[sh.id]; if(!x) return;
      if(x.duty < x.req) gaps.push({shift:sh, short:x.req-x.duty, kind:'duty'});
      else if(x.standby < x.reqSb) gaps.push({shift:sh, short:x.reqSb-x.standby, kind:'standby'});
    });
    return gaps;
  },
  /* off-day credit balance: +1 for every cover worked on an off day, -1 for every comp off taken */
  balance(did){
    let bal = (S.drivers[did]&&S.drivers[did].openingBalance)||0;
    Object.keys(S.roster).forEach(date=>{ const e=S.roster[date][did]; if(!e) return;
      if(e.cover) bal++;      // worked in place of someone while scheduled off
      if(e.comp)  bal--;      // took a compensating off day
    });
    return bal;
  },
  covers(){ // all cover records, newest first
    const out=[];
    Object.keys(S.roster).forEach(date=>{ const day=S.roster[date];
      Object.keys(day).forEach(did=>{ const e=day[did];
        if(e.cover) out.push({date, did, forDid:e.cover, shift:e.shift, settled:!!e.settled, settledOn:e.settledOn||null});
      });
    });
    return out.sort((a,b)=> b.date.localeCompare(a.date));
  },
  mcDays(fromISO,toISO){
    const out=[];
    Object.keys(S.roster).forEach(date=>{ if(date<fromISO||date>toISO) return;
      const day=S.roster[date];
      Object.keys(day).forEach(did=>{ if(day[did].t==='M') out.push({date,did,shift:day[did].shift}); });
    });
    return out.sort((a,b)=>a.date.localeCompare(b.date));
  },
  /* rank drivers who could take over `date` / `shiftId` */
  candidates(date, shiftId, excludeDid){
    const list=[];
    activeDrivers().forEach(d=>{
      if(d.id===excludeDid) return;
      const e=entry(date,d.id), t=e?e.t:'_';
      if(t==='M'||t==='L') return;                       // genuinely unavailable
      const already = (t==='D'||t==='S');
      const wh   = this.weekHours(d.id,date);
      const addH = already? 0 : shiftHours(shiftId);     // standby/duty already counted
      const newH = wh + addH;
      const otH  = Math.max(0, newH - S.settings.maxWeeklyHours) - Math.max(0, wh - S.settings.maxWeeklyHours);
      const rest = this.restBefore(d.id,date,shiftId);
      const cons = this.consecutiveDays(d.id, addDays(date,-1)) + (already?0:1);
      const bal  = this.balance(d.id);
      const money = Pay.costOfShift(d.id, date, shiftId);
      const shObj = shiftById(shiftId);
      const lorry = (t==='D'||t==='S') ? Fleet.byId(Fleet.vehicleFor(date,d.id)) : Fleet.pickFor(date, shiftId, d.id);
      const lorryOk = !Fleet.live().length || (lorry && !Fleet.downOn(lorry.id,date) && Fleet.fits(lorry,shObj));
      const licOk = Fleet.driverFits(d, shObj);
      let score, why;
      if(t==='S' && e.shift===shiftId){ score=150; why='standby on this shift — promote him, no extra cost'; }
      else if(t==='_'){                 score=145; why='spare, not rostered — no overtime'; }
      else if(t==='O'){                 score=125; why='on his off day — call in, off day is banked and returned'; }
      else if(t==='S'){                 score=115; why='standby on '+shiftName(e.shift)+' — move him across'; }
      else {                            score=-120; why='already on duty — this would be a double shift'; }
      score -= otH*10;                                   // overtime is what we are trying to avoid
      score -= Math.max(0,bal)*7;                        // spread the banked off days fairly
      if(rest < S.settings.minRestHours) score -= 60;
      if(cons > S.settings.maxConsecutiveDays) score -= 45;
      score -= Math.max(0, newH - (S.settings.maxWeeklyHours-8))*1.2;
      const warn=[];
      if(otH>0) warn.push('+'+otH.toFixed(1)+'h overtime');
      if(rest < S.settings.minRestHours) warn.push('only '+rest.toFixed(0)+'h rest (min '+S.settings.minRestHours+')');
      if(cons > S.settings.maxConsecutiveDays) warn.push(cons+' days straight');
      if(t==='D') warn.push('already on '+shiftName(e.shift));
      if(!licOk) warn.push('no '+shObj.licence+' licence');
      if(!lorryOk) warn.push('no lorry free for this shift');
      score -= Math.min(60, (money.cost||0)/25);      // cheapest cover first, in money not just hours
      if(!licOk)   score -= 200;                     // cannot legally drive it
      if(!lorryOk) score -= 90;                      // no roadworthy lorry to give him
      list.push({d, t, wh, newH, otH, rest, cons, bal, why, money, lorry, lorryOk, licOk, score:Math.round(score), warn});
    });
    return list.sort((a,b)=> b.score-a.score);
  },
  /* Is the fleet big enough? weekly man-days needed vs driver-days available */
  feasibility(){
    /* every regular job contributes only on the days it actually runs */
    let demand=0, hoursPerWeek=0, peak=0, dutyOnly=0, need=0;
    const perDay={};
    (S.settings.shifts||[]).forEach(sh=>{
      const c=contractById(sh.job);
      if(c && c.active===false) return;
      const dys=contractDays(c||{}), heads=(sh.required|0)+(sh.standby|0);
      demand += heads*dys.length;
      hoursPerWeek += hoursBetween(sh.start,sh.end)*heads*dys.length;
      need += heads; dutyOnly += (sh.required|0);
      dys.forEach(d=>{ perDay[d]=(perDay[d]||0)+heads; });
    });
    Object.values(perDay).forEach(v=>{ if(v>peak) peak=v; });
    const n = activeDrivers().length;
    const workDays = 7 - clamp(S.settings.offDaysPerWeek|0,0,6);
    const supply = n*workDays;                   // driver-days available per week
    const minDrivers = workDays? Math.ceil(demand/workDays) : 0;
    const avgHours = n? hoursPerWeek/n : 0;
    const otPerDriver = Math.max(0, avgHours - S.settings.maxWeeklyHours);
    return {need, dutyOnly, n, workDays, supply, demand, minDrivers, peak,
      short:Math.max(0,minDrivers-n), avgHours:Math.round(avgHours*10)/10,
      otPerDriver:Math.round(otPerDriver*10)/10, ok: supply>=demand && otPerDriver<=0};
  }
};

/* --------------------------- fleet / workshop ----------------------- */
const VSTATUS={active:{label:'On the road',cls:'ok'},workshop:{label:'In workshop',cls:'warn'},
  offroad:{label:'Off road',cls:'bad'},retired:{label:'Retired',cls:'neutral'}};
const MTYPE={service:'Scheduled service',repair:'Repair',inspection:'LTA inspection',
  tyre:'Tyres',bodywork:'Bodywork',aircon:'Air-con',other:'Other'};
const SEV={minor:{label:'Minor — kept going',cls:'warn'},major:{label:'Major — run abandoned',cls:'bad'},
  immobilised:{label:'Immobilised — towed',cls:'bad'}};

const Fleet = {
  all(){ return Object.values(S.vehicles).sort((a,b)=>
    (a.status==='retired')-(b.status==='retired') || (a.plate||'').localeCompare(b.plate||'')); },
  live(){ return this.all().filter(v=>v.status!=='retired'); },
  byId(id){ return S.vehicles[id]||null; },
  plate(id){ const v=this.byId(id); return v? v.plate : ''; },
  maintFor(vid){ return Object.values(S.maint).filter(m=>m.vehicleId===vid).sort((a,b)=>(b.date||'').localeCompare(a.date||'')); },
  breakdownsFor(vid){ return Object.values(S.breakdowns).filter(b=>b.vehicleId===vid).sort((a,b)=>(b.date||'').localeCompare(a.date||'')); },

  /* is this lorry off the road on a given date? */
  downOn(vid, date){
    const v=this.byId(vid); if(!v) return null;
    if(v.status==='retired') return {reason:'retired'};
    if(v.status==='offroad') return {reason:'marked off road'};
    const job=Object.values(S.maint).find(m=> m.vehicleId===vid && m.status!=='done' &&
      m.downFrom && m.downFrom<=date && (!m.downTo || m.downTo>=date));
    if(job) return {reason:(MTYPE[job.type]||'Workshop'), job};
    if(v.status==='workshop') return {reason:'in workshop'};
    return null;
  },
  availableOn(date){ return this.live().filter(v=>!this.downOn(v.id,date)); },

  /* next service, by mileage or by time, whichever lands first */
  serviceDue(v){
    const km = v.serviceEveryKm || S.settings.serviceEveryKm || 0;
    const mo = v.serviceEveryMonths || S.settings.serviceEveryMonths || 0;
    const out={dueKm:null, dueDate:null, kmLeft:null, daysLeft:null, overdue:false};
    if(km && v.lastServiceOdo!=null){ out.dueKm=Number(v.lastServiceOdo)+km;
      out.kmLeft = out.dueKm - (Number(v.odo)||0); }
    if(mo && v.lastServiceDate){ const d=parseISO(v.lastServiceDate); d.setMonth(d.getMonth()+mo);
      out.dueDate=iso(d); out.daysLeft=daysBetween(todayISO(), out.dueDate); }
    out.overdue = (out.kmLeft!=null && out.kmLeft<=0) || (out.daysLeft!=null && out.daysLeft<=0);
    return out;
  },
  /* every expiry / service / workshop warning, worst first */
  alerts(){
    const warn=S.settings.expiryWarnDays||45, out=[];
    this.live().forEach(v=>{
      [['roadTaxExp','Road tax'],['insuranceExp','Insurance'],['inspectionExp','Inspection']].forEach(([k,lbl])=>{
        if(!v[k]) return; const d=daysBetween(todayISO(), v[k]);
        if(d<=warn) out.push({vid:v.id, plate:v.plate, kind:lbl, days:d, date:v[k],
          level: d<0?'bad': d<=14?'bad':'warn',
          text: lbl+(d<0? ' expired '+Math.abs(d)+' day(s) ago' : ' expires in '+d+' day(s)')});
      });
      const sd=this.serviceDue(v);
      if(sd.overdue) out.push({vid:v.id, plate:v.plate, kind:'Service', level:'bad', days:-1,
        text:'Service overdue'+(sd.kmLeft!=null&&sd.kmLeft<=0? ' by '+Math.abs(sd.kmLeft)+' km':'')});
      else if(sd.kmLeft!=null && sd.kmLeft<1000) out.push({vid:v.id, plate:v.plate, kind:'Service', level:'warn',
        days:99, text:'Service due in '+sd.kmLeft+' km'});
      else if(sd.daysLeft!=null && sd.daysLeft<=warn) out.push({vid:v.id, plate:v.plate, kind:'Service', level:'warn',
        days:sd.daysLeft, text:'Service due in '+sd.daysLeft+' day(s)'});
      const down=this.downOn(v.id, todayISO());
      if(down) out.push({vid:v.id, plate:v.plate, kind:'Off road', level:'bad', days:-2,
        text: down.job? (down.reason+(down.job.downTo? ' — back on the road '+down.job.downTo : ' — no return date set'))
                      : down.reason});
    });
    Object.values(S.breakdowns).filter(b=>b.status!=='closed').forEach(b=>
      out.push({vid:b.vehicleId, plate:this.plate(b.vehicleId), kind:'Breakdown', level:'bad', days:-3,
        text:'Open breakdown '+(b.date||'')+' — '+(b.symptom||'')}));
    return out.sort((a,b)=> (a.level==='bad'?0:1)-(b.level==='bad'?0:1) || a.days-b.days);
  },
  /* ---- which lorry is this driver on for this date? ----
     The roster entry wins (a lorry is allocated per shift, because a lorry is
     shared across shifts and goes into the workshop without the driver going
     with it). The driver's own lorry is only the fallback. */
  vehicleFor(date, did){
    const e=entry(date,did);
    if(e && e.veh) return e.veh;
    const d=S.drivers[did];
    return (d && d.vehicleId) || null;
  },
  fits(v, sh){
    if(!v) return false;
    const want=(sh && sh.vehType || '').trim().toLowerCase();
    if(!want) return true;
    return String(v.type||'').toLowerCase().indexOf(want)>=0 || String(v.model||'').toLowerCase().indexOf(want)>=0;
  },
  driverFits(d, sh){
    const want=(sh && sh.licence || '').trim().toLowerCase();
    if(!want) return true;
    return String(d&&d.licence||'').toLowerCase().indexOf(want)>=0;
  },
  /* lorries already committed to an overlapping shift on this date */
  usedOn(date, shiftId, excludeDid){
    const sh=shiftById(shiftId), used={};
    const day=S.roster[date]||{};
    Object.keys(day).forEach(did=>{
      if(did===excludeDid) return;
      const e=day[did]; if(e.t!=='D' && e.t!=='S') return;
      if(shiftId && !shiftsOverlap(sh, shiftById(e.shift))) return;
      const v=this.vehicleFor(date,did); if(v) used[v]=(S.drivers[did]||{}).name||'someone';
    });
    return used;
  },
  /* every lorry that could be handed to a driver for this shift */
  freeOn(date, shiftId, excludeDid){
    const used=this.usedOn(date, shiftId, excludeDid), sh=shiftById(shiftId);
    return this.live().filter(v=> !this.downOn(v.id,date) && !used[v.id] && this.fits(v,sh));
  },
  /* pick the best lorry for a driver: his own if it is free and suitable */
  pickFor(date, shiftId, did){
    const d=S.drivers[did]; if(!d) return null;
    const free=this.freeOn(date, shiftId, did);
    if(!free.length) return null;
    const own=free.find(v=>v.id===d.vehicleId);
    if(own) return own;
    const sh=shiftById(shiftId);
    // otherwise the least-committed suitable lorry, preferring an exact type match
    return free.sort((a,b)=>{
      const at=(sh&&sh.vehType)? (String(a.type||'').toLowerCase()===String(sh.vehType).toLowerCase()?0:1):0;
      const bt=(sh&&sh.vehType)? (String(b.type||'').toLowerCase()===String(sh.vehType).toLowerCase()?0:1):0;
      return at-bt || String(a.plate||'').localeCompare(String(b.plate||''));
    })[0];
  },
  /* everything wrong with the lorry allocation on one date */
  conflicts(date){
    const out=[], seen={}, day=S.roster[date]||{};
    Object.keys(day).forEach(did=>{
      const e=day[did]; if(e.t!=='D' && e.t!=='S') return;
      const d=S.drivers[did]; if(!d || d.active===false) return;
      const sh=shiftById(e.shift);
      const vid=this.vehicleFor(date,did);
      if(!vid){ if(this.live().length) out.push({kind:'nolorry', did, name:d.name, shift:sh,
        text:d.name+' has no lorry for the '+((sh&&sh.name)||'')+' shift'}); return; }
      const v=this.byId(vid);
      if(!v){ out.push({kind:'missing', did, name:d.name, shift:sh, text:d.name+'\'s lorry is not in the register'}); return; }
      const down=this.downOn(vid,date);
      if(down) out.push({kind:'offroad', did, name:d.name, vid, shift:sh,
        text:d.name+' is on '+v.plate+', which is off the road — '+down.reason});
      if(!this.fits(v,sh)) out.push({kind:'type', did, name:d.name, vid, shift:sh,
        text:v.plate+' is a '+(v.type||'—')+' but the '+((sh&&sh.name)||'')+' shift needs a '+sh.vehType});
      if(!this.driverFits(d,sh)) out.push({kind:'licence', did, name:d.name, vid, shift:sh,
        text:d.name+' does not hold '+sh.licence+' for the '+((sh&&sh.name)||'')+' shift'});
      (seen[vid]=seen[vid]||[]).push({did, name:d.name, shift:sh});
    });
    Object.keys(seen).forEach(vid=>{
      const rows=seen[vid];
      for(let i=0;i<rows.length;i++) for(let j=i+1;j<rows.length;j++){
        if(shiftsOverlap(rows[i].shift, rows[j].shift))
          out.push({kind:'clash', vid, did:rows[j].did, name:rows[j].name,
            text:this.plate(vid)+' is on two overlapping shifts — '+rows[i].name+' and '+rows[j].name});
      }
    });
    return out;
  },
  /* can every duty driver actually get a lorry that day? */
  coverCheck(date){
    const cov=Rules.coverage(date);
    let duty=0; shiftsOn(date).forEach(sh=> duty+=(cov[sh.id]||{duty:0}).duty);
    const perShift = shiftsOn(date).map(sh=>({sh, duty:(cov[sh.id]||{duty:0}).duty}));
    const peak = Math.max(0, ...perShift.map(x=>x.duty));   // shifts don't overlap, so peak is what matters
    const avail = this.availableOn(date).length;
    return {peak, avail, short: Math.max(0, peak-avail), duty};
  },
  downtimeDays(m){ if(!m.downFrom) return 0; const to=m.downTo||m.downFrom;
    return Math.max(1, daysBetween(m.downFrom,to)+1); },
  costThisMonth(){ let c=0;
    Object.values(S.maint).forEach(m=>{ if(m.date && m.date.slice(0,7)===MONTH.y+'-'+pad2(MONTH.m+1)) c+=Number(m.cost)||0; });
    Object.values(S.breakdowns).forEach(b=>{ if(b.date && b.date.slice(0,7)===MONTH.y+'-'+pad2(MONTH.m+1)) c+=Number(b.cost)||0; });
    return c; }
};
function daysBetween(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }




/* ------------------------------- fuel --------------------------------
   Consumption is worked out the way a workshop does it: between two FULL
   tanks, the litres that went in are the litres that were burnt over the
   distance the odometer moved. Part fills still count towards spend, but
   never towards a consumption figure — that is what makes the number
   trustworthy rather than merely available.                            */
const FuelLog = {
  all(){ return Object.values(S.fuel||{}); },
  forVehicle(vid){ return this.all().filter(f=>f.vehicleId===vid)
    .sort((a,b)=> (a.date||'').localeCompare(b.date||'') || (Number(a.odo)||0)-(Number(b.odo)||0)); },
  inRange(from,to){ return this.all().filter(f=> f.date && f.date>=from && f.date<=to); },
  price(){ return Number(S.settings.fuelPrice)||2.60; },

  totals(from,to){
    const out={litres:0, cost:0, fills:0, byVehicle:{}};
    this.inRange(from,to).forEach(f=>{
      const l=Number(f.litres)||0, c=Number(f.cost)||0;
      out.litres+=l; out.cost+=c; out.fills++;
      const r=out.byVehicle[f.vehicleId]=out.byVehicle[f.vehicleId]||{litres:0,cost:0,fills:0};
      r.litres+=l; r.cost+=c; r.fills++;
    });
    return out;
  },
  /* litres per 100 km from consecutive full tanks */
  efficiency(vid){
    const rows=this.forVehicle(vid).filter(f=>Number(f.odo)>0);
    let km=0, litres=0, pairs=0;
    for(let i=1;i<rows.length;i++){
      const a=rows[i-1], b=rows[i];
      if(!a.full || !b.full) continue;                 // only full-to-full is measurable
      const d=(Number(b.odo)||0)-(Number(a.odo)||0);
      if(d<=0 || d>5000) continue;                     // a rollback or a missed fill
      km+=d; litres+=Number(b.litres)||0; pairs++;
    }
    if(!pairs || !km) return {lPer100:null, pairs:0};
    const lPer100=litres/km*100;
    return {lPer100:Math.round(lPer100*10)/10, kmPerL:Math.round(km/litres*100)/100,
      costPerKm:Math.round(lPer100/100*this.price()*1000)/1000, km, litres, pairs};
  },
  /* the figure to use for a lorry: measured if we have it, else its own
     setting, else the fleet default — always labelled with which */
  consumption(vid){
    const e=this.efficiency(vid);
    if(e.lPer100) return {lPer100:e.lPer100, source:'measured over '+e.km.toLocaleString()+' km'};
    const v=Fleet.byId(vid);
    if(v && Number(v.lPer100)>0) return {lPer100:Number(v.lPer100), source:'set on the lorry'};
    return {lPer100:Number(S.settings.defaultLPer100)||22, source:'fleet default'};
  },
  estimateCost(vid, km){ const c=this.consumption(vid);
    return {cost: km*(c.lPer100/100)*this.price(), lPer100:c.lPer100, source:c.source}; },
  costPerKm(vid){ const c=this.consumption(vid); return c.lPer100/100*this.price(); }
};

/* -------------------------- reporting figures ------------------------
   Hours come from the roster, distance and trips from the delivery jobs.
   Nothing here estimates anything new — it aggregates what the other
   engines already produce, so a figure on a chart always traces back to a
   row you can open.                                                     */
const Stats = {
  /* time buckets for the chosen granularity, ending in the month on screen */
  buckets(gran, ym){
    const out=[];
    if(gran==='day'){
      monthDays(ym.y, ym.m).forEach(d=> out.push({key:d, from:d, to:d,
        label:String(parseISO(d).getDate()), full:fmtDay(d), tick:(parseISO(d).getDate()%5===1||parseISO(d).getDate()===1)}));
    } else if(gran==='week'){
      let ws=weekStartOf(monthDays(ym.y,ym.m).slice(-1)[0]);
      for(let i=11;i>=0;i--){ const f=addDays(ws,-7*i), t=addDays(f,6);
        out.push({key:f, from:f, to:t, label:parseISO(f).getDate()+' '+MON[parseISO(f).getMonth()].slice(0,3),
          full:fmtDay(f)+' → '+fmtDay(t), tick:true}); }
    } else if(gran==='month'){
      for(let i=11;i>=0;i--){ let m=ym.m-i, y=ym.y; while(m<0){ m+=12; y--; }
        const days=monthDays(y,m);
        out.push({key:y+'-'+pad2(m+1), from:days[0], to:days[days.length-1],
          label:MON[m].slice(0,3), full:MON[m]+' '+y, tick:true}); }
    } else {
      for(let i=4;i>=0;i--){ const y=ym.y-i;
        out.push({key:String(y), from:y+'-01-01', to:y+'-12-31',
          label:String(y), full:'Year '+y, tick:true}); }
    }
    return out;
  },
  span(gran, ym){ const b=this.buckets(gran,ym); return {from:b[0].from, to:b[b.length-1].to, buckets:b}; },

  /* actual hours on the roster, split at the weekly normal */
  driverHours(from, to){
    const norm=S.settings.maxWeeklyHours||44;
    return activeDrivers().map(d=>{
      let total=0, days=0, standby=0; const weekly={};
      for(let dt=from; dt<=to; dt=addDays(dt,1)){
        const e=entry(dt,d.id); if(!e||(e.t!=='D'&&e.t!=='S')) continue;
        const h=shiftHours(e.shift); total+=h; days++; if(e.t==='S') standby+=h;
        const ws=weekStartOf(dt); weekly[ws]=(weekly[ws]||0)+h;
      }
      let ot=0; Object.keys(weekly).forEach(k=> ot+=Math.max(0, weekly[k]-norm));
      ot=Math.round(ot*10)/10;
      return {id:d.id, name:d.name, total:Math.round(total*10)/10, ot, normal:Math.round((total-ot)*10)/10, days, standby};
    }).filter(r=>r.total>0).sort((a,b)=> b.total-a.total);
  },
  fleetHours(from,to){ return this.driverHours(from,to).reduce((a,r)=>a+r.total,0); },

  /* distance and trips per lorry, straight from the job ledger */
  vehicleStats(from, to){
    const by=Dist.byVehicle(from,to);
    return Fleet.live().map(v=>{ const r=by[v.id]||{km:0,jobs:0,actual:0,estimated:0};
      return {id:v.id, plate:v.plate, type:v.type||'', km:Math.round(r.km*10)/10, trips:r.jobs,
        measured:r.actual||0, estimated:r.estimated||0};
    }).filter(r=> r.km>0 || r.trips>0).sort((a,b)=> b.km-a.km);
  },
  /* one number per bucket, for the trend column chart */
  series(gran, ym, metric){
    const sp=this.span(gran,ym);
    const fuelMode = (metric==='cost')? OpCost.fuelMode(sp.from, sp.to) : null;
    return this.buckets(gran,ym).map(b=>{
      let v=0;
      if(metric==='hours') v=this.fleetHours(b.from,b.to);
      else if(metric==='fuel') v=FuelLog.totals(b.from,b.to).cost;
      else if(metric==='cost') v=OpCost.total(b.from,b.to,fuelMode).total;
      else { const by=Dist.byVehicle(b.from,b.to);
        Object.keys(by).forEach(k=> v += metric==='trips'? by[k].jobs : by[k].km); }
      return Object.assign({}, b, {value:Math.round(v*10)/10});
    });
  }
};




/* ------------------------ fixed overheads ----------------------------
   The bills that arrive whether a wheel turns or not: insurance, road tax,
   yard rental, licences, finance. They are the reason a quiet month still
   costs money, so they belong in the cost picture rather than in a footnote. */
const OH_CATS = {insurance:'Insurance', roadtax:'Road tax', rental:'Yard / office rental',
  licence:'Licences & permits', finance:'Loan / lease', telematics:'Tracking & software',
  salary:'Office & admin salaries', other:'Other'};
const Overheads = {
  all(){ return Object.values(S.overheads||{}).sort((a,b)=> (b.amount||0)-(a.amount||0)); },
  active(date){ return this.all().filter(o=> o.active!==false &&
    (!o.startDate || o.startDate<=date) && (!o.endDate || o.endDate>=date)); },
  /* what one overhead costs per calendar day on a given date */
  perDay(o, date){
    const y=parseISO(date).getFullYear(), m=parseISO(date).getMonth();
    const dim=monthDays(y,m).length;
    let monthly=Number(o.amount)||0;
    if(o.period==='year') monthly=monthly/12;
    if(o.perVehicle) monthly = monthly * (o.vehicleId? 1 : Fleet.live().length);
    return monthly/dim;
  },
  cost(from,to){
    let total=0; const byCat={};
    for(let d=from; d<=to; d=addDays(d,1)){
      this.active(d).forEach(o=>{
        const c=this.perDay(o,d); total+=c;
        byCat[o.category||'other']=(byCat[o.category||'other']||0)+c;
      });
    }
    return {total, byCat};
  },
  monthlyRunRate(){
    const d=todayISO();
    return this.active(d).reduce((a,o)=>{
      let m=Number(o.amount)||0; if(o.period==='year') m/=12;
      if(o.perVehicle) m*= (o.vehicleId? 1 : Fleet.live().length);
      return a+m; }, 0);
  }
};
/* Recurring contract income, if the planner has filled it in. Everything
   revenue-related is optional — with nothing entered, the margin figures
   simply do not appear rather than showing a misleading zero. */
const Revenue = {
  any(){ return Object.values(S.contracts||{}).some(c=> Number(c.monthlyValue)>0); },
  amount(from,to){
    let total=0;
    Object.values(S.contracts||{}).forEach(c=>{
      const v=Number(c.monthlyValue)||0; if(!v || c.active===false) return;
      let cur=from;
      while(cur<=to){
        const y=parseISO(cur).getFullYear(), m=parseISO(cur).getMonth(), days=monthDays(y,m);
        const mFrom=days[0]>from?days[0]:from, mTo=days[days.length-1]<to?days[days.length-1]:to;
        let f=mFrom, t=mTo;
        if(c.startDate && c.startDate>f) f=c.startDate;
        if(c.endDate && c.endDate<t) t=c.endDate;
        if(f<=t) total += v*(daysBetween(f,t)+1)/days.length;
        cur=addDays(days[days.length-1],1);
      }
    });
    return total;
  }
};

/* -------------------------- operational cost -------------------------
   Four buckets, because that is how the money actually leaves: standing
   wages, the premium on top of them, fuel, and the workshop. Basic pay is
   spread across the calendar days of its month — a monthly salary is owed
   whether or not the lorry moved, and hiding that makes a daily cost chart
   look far cheaper than the business is.                                */
const OpCost = {
  labour(from, to){
    const norm=S.settings.maxWeeklyHours||44, nd=S.settings.normalDailyHours||8;
    let basic=0, otPay=0, restPay=0, otH=0, restDays=0;
    const drv=activeDrivers();
    /* standing basic, prorated month by month */
    drv.forEach(d=>{
      if(d.payType==='hourly') return;
      let cur=from;
      while(cur<=to){
        const y=parseISO(cur).getFullYear(), m=parseISO(cur).getMonth(), days=monthDays(y,m);
        const mFrom=days[0]>from?days[0]:from, mTo=days[days.length-1]<to?days[days.length-1]:to;
        basic += Pay.basic(d)*(daysBetween(mFrom,mTo)+1)/days.length;
        cur=addDays(days[days.length-1],1);
      }
    });
    /* The variable half. Overtime is charged to the DAY it is incurred: you
       cross the weekly normal partway through the week and everything after it
       is overtime. Attributing it that way is both what happens in practice and
       what makes a daily column add up to its week and its month — a weekly
       lump cannot be split across days after the fact. */
    drv.forEach(d=>{
      for(let dt=from; dt<=to; dt=addDays(dt,1)){
        const e=entry(dt,d.id); if(!e||(e.t!=='D'&&e.t!=='S')) continue;
        const h=shiftHours(e.shift);
        const rd=Pay.restDayWorked(dt,d.id);
        if(rd && !rd.swapped){
          const full=h>nd/2;
          const daysPay=(S.settings.restDayAtEmployerRequest!==false)?(full?2:1):(full?1:0.5);
          restPay += daysPay*Pay.daily(d) + Math.max(0,h-nd)*Pay.otRate(d);
          restDays++;
          continue;                                   // paid under the rest-day rules instead
        }
        if(d.payType==='hourly') basic += h*Pay.hourly(d);
        /* hours already banked earlier in this week — counted whether or not
           those days fall inside the range being costed */
        let prior=0;
        const ws=weekStartOf(dt);
        for(let x=ws; x<dt; x=addDays(x,1)){
          const pe=entry(x,d.id); if(!pe||(pe.t!=='D'&&pe.t!=='S')) continue;
          const prd=Pay.restDayWorked(x,d.id); if(prd && !prd.swapped) continue;
          prior+=shiftHours(pe.shift);
        }
        const marginal=Math.max(0, prior+h-norm)-Math.max(0, prior-norm);
        if(marginal>0){ otH+=marginal; otPay+=marginal*Pay.otRate(d); }
      }
    });
    return {basic, otPay, restPay, premium:otPay+restPay, otH:Math.round(otH*100)/100, restDays};
  },
  /* Actual or estimated has to be decided ONCE for the whole period on screen.
     Deciding per bucket means a day with a fill shows the real spend while the
     day beside it shows a guess, and the columns no longer add up to the month. */
  fuelMode(from, to){ return FuelLog.inRange(from,to).length? 'actual' : 'estimate'; },
  fuel(from, to, mode){
    mode = mode || this.fuelMode(from,to);
    if(mode==='actual'){
      const t=FuelLog.totals(from,to);
      return {cost:t.cost, estimated:false, litres:t.litres, fills:t.fills};
    }
    let est=0;
    const by=Dist.byVehicle(from,to);
    Object.keys(by).forEach(vid=> est += FuelLog.estimateCost(vid, by[vid].km).cost);
    return {cost:est, estimated:est>0, litres:0, fills:0};
  },
  workshop(from, to){
    let c=0, jobs=0;
    Object.values(S.maint||{}).forEach(m=>{ if(m.date&&m.date>=from&&m.date<=to){ c+=Number(m.cost)||0; jobs++; } });
    Object.values(S.breakdowns||{}).forEach(b=>{ if(b.date&&b.date>=from&&b.date<=to){ c+=Number(b.cost)||0; jobs++; } });
    return {cost:c, jobs};
  },
  total(from, to, fuelMode){
    const l=this.labour(from,to), f=this.fuel(from,to,fuelMode), w=this.workshop(from,to);
    const o=Overheads.cost(from,to);
    const parts=[
      {key:'basic',    name:'Basic pay',        value:l.basic,   fill:'var(--s1)'},
      {key:'premium',  name:'Overtime & rest days', value:l.premium, fill:'var(--s2)'},
      {key:'fuel',     name:'Fuel'+(f.estimated?' (est)':''), value:f.cost, fill:'var(--s3)'},
      {key:'workshop', name:'Workshop & repairs', value:w.cost,  fill:'var(--s4)'},
      {key:'overhead', name:'Fixed overheads',  value:o.total,   fill:'var(--s5)'}
    ];
    const total=parts.reduce((a,p)=>a+p.value,0);
    return {parts, total, labour:l, fuelInfo:f, workshopInfo:w, overheadInfo:o};
  },
  /* per-km and per-trip only mean anything with distance behind them */
  unit(from, to, fuelMode){
    const t=this.total(from,to,fuelMode);
    const veh=Stats.vehicleStats(from,to);
    const km=veh.reduce((a,r)=>a+r.km,0), trips=veh.reduce((a,r)=>a+r.trips,0);
    return {perKm: km? t.total/km : null, perTrip: trips? t.total/trips : null, km, trips, total:t.total};
  }
};


/* ---------------------------- owner summary --------------------------
   One page for whoever signs the cheques: what it cost, what it earned if
   that is known, what is being spent that need not be, and what is about
   to become a problem. Every figure links back to the screen that owns it. */
const Boss = {
  avoidable(from, to){
    const out=[];
    /* overtime a legal swap would remove */
    const moves=Balance.findMoves(from,to,20);
    if(moves.length){
      const h=moves.reduce((a,m)=>a+m.saveH,0), c=moves.reduce((a,m)=>a+m.saveCost,0);
      out.push({name:'Overtime that could be moved', amount:c,
        detail:Math.round(h*10)/10+'h across '+moves.length+' shift(s), each movable to a driver with room inside the '+
          (S.settings.maxWeeklyHours||44)+'h week', go:"VIEW='stats';Render.all()"});
    }
    /* rest days worked and never returned */
    const owed=Rules.covers().filter(c=>!c.settled && c.date>=from && c.date<=to);
    if(owed.length){
      let c=0; owed.forEach(o=>{ const d=S.drivers[o.did]; if(!d) return;
        const mult=(S.settings.restDayAtEmployerRequest!==false)?2:1; c+=mult*Pay.daily(d); });
      out.push({name:'Rest days worked and not returned', amount:c,
        detail:owed.length+' day(s). Swapping the day back inside the same week costs nothing at all',
        go:"VIEW='cover';Render.all()"});
    }
    /* lorries that broke down more than once */
    const cnt={}; Object.values(S.breakdowns||{}).forEach(b=>{ if(b.date>=from&&b.date<=to) cnt[b.vehicleId]=(cnt[b.vehicleId]||0)+1; });
    const repeat=Object.keys(cnt).filter(k=>cnt[k]>=2);
    if(repeat.length){
      let c=0; Object.values(S.breakdowns||{}).forEach(b=>{ if(repeat.indexOf(b.vehicleId)>=0 && b.date>=from&&b.date<=to) c+=Number(b.cost)||0; });
      Object.values(S.maint||{}).forEach(m=>{ if(repeat.indexOf(m.vehicleId)>=0 && m.type==='repair' && m.date>=from&&m.date<=to) c+=Number(m.cost)||0; });
      out.push({name:'Repeat breakdowns', amount:c,
        detail:repeat.map(k=>Fleet.plate(k)+' ('+cnt[k]+')').join(', ')+' — roadside repairs cost more than the diagnosis would',
        go:"VIEW='fleet';SUB.fleetTab='breakdowns';Render.all()"});
    }
    /* lorries earning nothing */
    const veh=Stats.vehicleStats(from,to);
    const moved={}; veh.forEach(v=>moved[v.id]=true);
    const idle=Fleet.live().filter(v=>!moved[v.id]);
    if(idle.length && Overheads.monthlyRunRate()>0){
      const share=Overheads.cost(from,to).total/Math.max(1,Fleet.live().length)*idle.length;
      out.push({name:idle.length+' lorry(ies) did no recorded work', amount:share,
        detail:idle.map(v=>v.plate).join(', ')+' — still carrying their share of insurance, road tax and finance',
        go:"VIEW='fleet';SUB.fleetTab='vehicles';Render.all()"});
    }
    /* overtime baked into the shift pattern */
    const F=Rules.feasibility();
    if(F.otPerDriver>0){
      const wk=F.otPerDriver*activeDrivers().reduce((a,d)=>a+Pay.otRate(d),0);
      out.push({name:'Overtime built into the shift pattern', amount:wk*4.345,
        detail:'Every driver averages '+F.avgHours+'h a week, '+F.otPerDriver+'h over the norm, before anyone falls sick. '+
          (F.short? F.short+' more driver(s) would remove it' : 'A smaller headcount on one shift or a shorter shift removes it'),
        go:"VIEW='regular';Render.all()"});
    }
    return out.sort((a,b)=>b.amount-a.amount);
  },
  risks(){
    const out=[], today=todayISO();
    Fleet.alerts().forEach(a=>{
      if(a.kind==='Off road' || a.kind==='Breakdown')
        out.push({level:'bad', text:a.plate+' — '+a.text, go:"VIEW='fleet';Render.all()"});
      else if(a.days<0) out.push({level:'bad', text:a.plate+' — '+a.text, go:"VIEW='fleet';Render.all()"});
      else out.push({level:'warn', text:a.plate+' — '+a.text, go:"VIEW='fleet';Render.all()"});
    });
    const cap=S.settings.maxMonthlyOT||72;
    Pay.fleetMonth(MONTH).rows.filter(r=>r.otHours>cap).forEach(r=>
      out.push({level:'bad', text:r.driver.name+' is on '+r.otHours+'h overtime this month, over the '+cap+'h legal cap',
        go:"VIEW='cost';Render.all()"}));
    let gap=0;
    monthDays(MONTH.y,MONTH.m).forEach(d=>{ if(Rules.dayGaps(d).some(g=>g.kind==='duty')) gap++; });
    if(gap) out.push({level:'bad', text:gap+' day(s) this month have a shift with nobody on it', go:"VIEW='roster';Render.all()"});
    return out.sort((a,b)=> (a.level==='bad'?0:1)-(b.level==='bad'?0:1));
  }
};

/* --------------------- balancing suggestions -------------------------
   Every suggestion names a specific date, a specific pair of people and
   what it is worth. A suggestion you cannot act on in one click is just a
   complaint, so each one carries the action that carries it out.       */
const Balance = {
  moveShift(date, fromId, toId){
    const e=entry(date,fromId); if(!e) return false;
    DB.putMany([
      ['roster/'+date+'/'+fromId, {t:'O', note:'moved to level the hours'}],
      ['roster/'+date+'/'+toId, Object.assign({}, entry(date,toId)||{}, {t:e.t, shift:e.shift, veh:e.veh||null,
        note:'picked up from '+((S.drivers[fromId]||{}).name||'')})]
    ]);
    Render.all();
    return true;
  },
  /* concrete shift moves that take a week back under the normal hours */
  findMoves(from, to, limit){
    limit=limit||4;
    const norm=S.settings.maxWeeklyHours||44, minRest=S.settings.minRestHours||0,
          maxCons=S.settings.maxConsecutiveDays||6;
    const hrs=Stats.driverHours(from,to);
    const over=hrs.filter(r=>r.ot>0).sort((a,b)=>b.ot-a.ot);
    const under=hrs.slice().sort((a,b)=>a.total-b.total);
    const moves=[], taken={};
    over.forEach(hi=>{
      for(let d=from; d<=to && moves.length<limit; d=addDays(d,1)){
        if(taken[d+'|'+hi.id]) continue;
        const e=entry(d,hi.id);
        if(!e || (e.t!=='D'&&e.t!=='S') || e.locked || e.cover) continue;
        if(Rules.weekHours(hi.id,d) <= norm) continue;          // this week is not the problem
        const sh=shiftById(e.shift), hours=shiftHours(e.shift);
        const taker=under.find(lo=>{
          if(lo.id===hi.id || taken[d+'|'+lo.id]) return false;
          const le=entry(d,lo.id);
          if(le && ['D','S','M','L'].indexOf(le.t)>=0) return false;      // working or away
          if(Rules.weekHours(lo.id,d)+hours > norm) return false;         // would only shift the overtime
          if(!Fleet.driverFits(lo, sh)) return false;
          if(Rules.restBefore(lo.id,d,e.shift) < minRest) return false;
          if(Rules.consecutiveDays(lo.id, addDays(d,-1))+1 > maxCons) return false;
          return true;
        });
        if(!taker) continue;
        const saveH=Math.min(hours, Rules.weekHours(hi.id,d)-norm);
        moves.push({date:d, shift:e.shift, from:hi, to:taker, hours,
          saveH:Math.round(saveH*10)/10, saveCost: saveH*Pay.otRate(S.drivers[hi.id])});
        taken[d+'|'+hi.id]=1; taken[d+'|'+taker.id]=1;
      }
    });
    return moves;
  },
  suggest(from, to){
    const out=[];
    /* 1 — shifts nobody is on */
    let gapDays=0, firstGap=null;
    for(let d=from; d<=to; d=addDays(d,1)){
      const g=Rules.dayGaps(d).filter(x=>x.kind==='duty');
      if(g.length){ gapDays++; if(!firstGap) firstGap={date:d, shift:g[0].shift}; }
    }
    if(gapDays) out.push({level:'bad', title:gapDays+' day(s) have an unmanned shift',
      detail:'The first is '+fmtDay(firstGap.date)+', '+firstGap.shift.name+'. Cover these before anything else — '+
        'everything below is about cost, this one is about the work not going out.',
      label:'Find cover for '+fmtDay(firstGap.date),
      act:'Flow.fillGap(\''+firstGap.date+'\',\''+firstGap.shift.id+'\',\'duty\')'});

    /* 2 — the overtime that can simply be moved */
    const moves=this.findMoves(from,to,4);
    moves.forEach(m=> out.push({level:'warn',
      title:'Move '+fmtDay(m.date)+' '+shiftName(m.shift)+' from '+m.from.name+' to '+m.to.name,
      detail:m.from.name+' is on '+m.from.total+'h with '+m.from.ot+'h overtime; '+m.to.name+' is on '+m.to.total+
        'h and free that day. The move is legal on rest, licence and consecutive days, and saves '+
        m.saveH+'h of overtime'+(Pay.basic(S.drivers[m.from.id])>0? ' — about '+Pay.money(m.saveCost):'')+'.',
      label:'Make the swap', act:'Balance.moveShift(\''+m.date+'\',\''+m.from.id+'\',\''+m.to.id+'\')'}));

    /* 3 — rest days worked and still owed */
    const owed=Rules.covers().filter(c=>!c.settled && c.date>=from && c.date<=to);
    if(owed.length){ const c=owed[0];
      out.push({level:'warn', title:owed.length+' rest day(s) worked and not given back',
        detail:'Until the day is returned it is payable at '+
          ((S.settings.restDayAtEmployerRequest!==false)?'two days':'one day')+'\' salary. '+
          (S.drivers[c.did]||{}).name+' is owed one from '+fmtDay(c.date)+'.',
        label:'Return the off day', act:'Flow.settle(\''+c.date+'\',\''+c.did+'\',\''+c.forDid+'\')'});
    }

    /* 4 — jobs with nobody on them */
    const un=Object.values(S.jobs||{}).filter(j=> j.date>=from && j.date<=to && !j.assigned && j.status!=='done');
    if(un.length){ const urgent=un.filter(j=>j.urgency==='urgent');
      const j=(urgent[0]||un[0]);
      out.push({level:urgent.length?'bad':'warn',
        title:un.length+' delivery job(s) unassigned'+(urgent.length? ', '+urgent.length+' of them urgent':''),
        detail:'Unassigned jobs never reach a lorry, so their distance and cost are missing from every figure here. '+
          'Start with "'+(j.title||'')+'" on '+fmtDay(j.date)+'.',
        label:'Assign it', act:'Flow.assignJob(\''+j.id+'\')'});
    }

    /* 5 — a driver on duty with no lorry */
    let noLorry=null;
    for(let d=from; d<=to && !noLorry; d=addDays(d,1)){
      const c=Fleet.conflicts(d).find(x=>x.kind==='nolorry'||x.kind==='offroad');
      if(c) noLorry={date:d, c};
    }
    if(noLorry) out.push({level:'bad', title:'A driver has no roadworthy lorry',
      detail:noLorry.c.text+' on '+fmtDay(noLorry.date)+'.',
      label:'Give him one', act:'Flow.swapVehicle(\''+noLorry.c.did+'\',\''+noLorry.date+'\')'});

    /* 6 — workload spread, when there is nothing mechanical left to fix */
    const hrs=Stats.driverHours(from,to);
    if(hrs.length>1){
      const hi=hrs[0], lo=hrs[hrs.length-1], spread=hi.total-lo.total;
      if(spread >= (S.settings.normalDailyHours||8)*2 && !moves.length)
        out.push({level:'warn', title:'Hours are '+Math.round(spread)+'h apart across the fleet',
          detail:hi.name+' is on '+hi.total+'h and '+lo.name+' on '+lo.total+'h, and no single legal swap closes it — '+
            'the pattern itself is uneven. Re-running Auto-plan over the range levels it properly.',
          label:'Open the roster', act:'VIEW=\'roster\';Render.all()'});
    }

    /* 7 — lorry use */
    const veh=Stats.vehicleStats(from,to);
    if(veh.length>2){
      const top=veh[0], bot=veh[veh.length-1];
      if(top.km > bot.km*3 && bot.km>0)
        out.push({level:'ok', title:'Mileage is concentrated on a few lorries',
          detail:top.plate+' covered '+Math.round(top.km).toLocaleString()+' km while '+bot.plate+' did '+
            Math.round(bot.km).toLocaleString()+' km. Spreading the work evens out wear and pushes the next service further out on both.',
          label:'Open the register', act:'VIEW=\'fleet\';SUB.fleetTab=\'vehicles\';Render.all()'});
    }
    return out;
  }
};

/* ------------------------------ charts -------------------------------
   Plain SVG: no library, so the file stays one file and works offline.
   Specs follow the house rules — bars capped at 24px with a 4px rounded
   data-end and a square baseline, 2px surface gaps, hairline grid.      */
const VIZ = {
  tip(html, ev){
    const t=$('#vtip');
    if(!html){ t.classList.remove('on'); return; }
    t.innerHTML=html; t.classList.add('on');
    const r=t.getBoundingClientRect();
    let x=ev.clientX+14, y=ev.clientY-r.height-10;
    if(x+r.width>innerWidth-8) x=ev.clientX-r.width-14;
    if(y<8) y=ev.clientY+18;
    t.style.left=x+'px'; t.style.top=y+'px';
  },
  /* rounded on the data end only, square on the baseline */
  barPath(x,y,w,h,r,dir){
    r=Math.max(0,Math.min(r, dir==='up'? h : w, dir==='up'? w/2 : h/2));
    if(h<=0||w<=0) return '';
    if(dir==='up') return 'M'+x+','+(y+h)+'V'+(y+r)+'a'+r+','+r+' 0 0 1 '+r+',-'+r+'h'+(w-2*r)+
      'a'+r+','+r+' 0 0 1 '+r+','+r+'V'+(y+h)+'Z';
    return 'M'+x+','+y+'h'+(w-r)+'a'+r+','+r+' 0 0 1 '+r+','+r+'v'+(h-2*r)+
      'a'+r+','+r+' 0 0 1 -'+r+','+r+'H'+x+'Z';
  },
  /* round to clean tick values (0 / 50 / 100 …) rather than a round maximum,
     which is what produces axes like 62.5 / 125 / 187.5 */
  niceScale(v, want){
    want = want || 5;
    if(!(v>0)) return {max:1, step:0.25, ticks:4};
    const raw=v/want, p=Math.pow(10, Math.floor(Math.log10(raw))), n=raw/p;
    const step=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;
    const max=Math.ceil(v/step)*step;
    return {max, step, ticks:Math.max(1, Math.round(max/step))};
  },
  fmt(n, unit, money){
    if(money) return Pay.money(n);
    const v=Math.abs(n)>=1000? Math.round(n).toLocaleString() : (Math.round(n*10)/10).toLocaleString();
    return v+(unit?' '+unit:'');
  },

  /* time-series columns — one series, so no legend; the title names it */
  columns(id, rows, opts){
    opts=opts||{};
    const W=Math.max(980, rows.length*34), H=opts.height||240;
    const padL=54, padR=14, padT=14, padB=30;
    const iw=W-padL-padR, ih=H-padT-padB;
    const sc=this.niceScale(Math.max(...rows.map(r=>r.value), 0)); const max=sc.max;
    const band=iw/Math.max(1,rows.length);
    const bw=Math.min(24, Math.max(3, band-2));           // 2px surface gap between neighbours
    let g='';
    for(let i=0;i<=sc.ticks;i++){ const y=padT+ih-(ih*i/sc.ticks);
      g+='<line class="gl" x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'"/>'+
         '<text class="tk" x="'+(padL-8)+'" y="'+(y+3.5)+'" text-anchor="end">'+esc(this.fmt(sc.step*i))+'</text>'; }
    rows.forEach((r,i)=>{
      const h=max? ih*r.value/max : 0;
      const x=padL+band*i+(band-bw)/2, y=padT+ih-h;
      if(h>0) g+='<path class="mk" d="'+this.barPath(x,y,bw,h,4,'up')+'" fill="var(--s1)" '+
        'data-t="'+esc(r.full)+'|'+esc(this.fmt(r.value, opts.unit, opts.money))+'"/>';
      if(r.tick) g+='<text class="tk" x="'+(x+bw/2)+'" y="'+(padT+ih+15)+'" text-anchor="middle">'+esc(r.label)+'</text>';
    });
    g+='<line class="ax" x1="'+padL+'" y1="'+(padT+ih)+'" x2="'+(W-padR)+'" y2="'+(padT+ih)+'"/>';
    return '<div class="viz" style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H+'" style="max-width:'+W+'px" role="img" '+
      'aria-label="'+esc(opts.aria||'')+'" data-viz="'+id+'">'+g+'</svg></div>';
  },

  /* horizontal bars, optionally stacked into two segments */
  barsH(id, rows, opts){
    opts=opts||{};
    const n=rows.length, rowH=opts.rowH||26, H=Math.max(60, n*rowH+34);
    const W=980, padL=Math.round((opts.padL||130)*980/760), padR=90, padT=8, padB=26;
    const iw=W-padL-padR, ih=n*rowH;
    const sc=this.niceScale(Math.max(...rows.map(r=>r.total), 0)); const max=sc.max;
    const bh=Math.min(24, rowH-6);                         // cap thickness, leave air
    let g='';
    for(let i=0;i<=sc.ticks;i++){ const x=padL+iw*i/sc.ticks;
      g+='<line class="gl" x1="'+x+'" y1="'+padT+'" x2="'+x+'" y2="'+(padT+ih)+'"/>'+
         '<text class="tk" x="'+x+'" y="'+(padT+ih+16)+'" text-anchor="middle">'+esc(this.fmt(sc.step*i))+'</text>'; }
    rows.forEach((r,i)=>{
      const y=padT+i*rowH+(rowH-bh)/2;
      let x=padL;
      const segs=(r.segments&&r.segments.length)? r.segments : [{value:r.total, fill:'var(--s1)', name:''}];
      const drawn=segs.filter(sg=>sg.value>0);
      drawn.forEach((sg,k)=>{
        let w=max? iw*sg.value/max : 0;
        const last=k===drawn.length-1;
        if(!last) w=Math.max(0,w-2);                       // 2px surface gap inside the stack
        if(w<=0) return;
        g+='<path class="mk" d="'+this.barPath(x,y,w,bh,last?4:0,'right')+'" fill="'+sg.fill+'" '+
          'data-t="'+esc(r.label)+'|'+esc((sg.name? sg.name+': ':'')+this.fmt(sg.value, opts.unit, opts.money))+
          (r.note? '|'+esc(r.note):'')+'"/>';
        x+=w+(last?0:2);
      });
      g+='<text class="lb" x="'+(padL-10)+'" y="'+(y+bh/2+4)+'" text-anchor="end">'+esc(r.label)+'</text>';
      g+='<text class="dv" x="'+(Math.min(padL+ (max? iw*r.total/max:0), W-padR)+8)+'" y="'+(y+bh/2+4)+'">'+
         esc(this.fmt(r.total, opts.unit, opts.money))+'</text>';
    });
    g+='<line class="ax" x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+ih)+'"/>';
    return '<div class="viz" style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+(H)+'" style="max-width:'+W+'px" role="img" '+
      'aria-label="'+esc(opts.aria||'')+'" data-viz="'+id+'">'+g+'</svg></div>';
  },
  /* one wide bar, four parts. Labels ride inside a segment only when the
     text genuinely fits — the rest are carried by the legend below. */
  composition(id, segs, opts){
    opts=opts||{};
    const W=980, H=64, padL=0, padR=0, y=8, bh=36;
    const total=segs.reduce((a,s2)=>a+s2.value,0);
    if(total<=0) return '<div class="empty">Nothing to cost in this period.</div>';
    const iw=W;
    let x=0, g='';
    const drawn=segs.filter(s2=>s2.value>0);
    drawn.forEach((s2,i)=>{
      let w=iw*s2.value/total;
      const last=i===drawn.length-1;
      if(!last) w=Math.max(0,w-2);                       // 2px surface gap
      if(w<=0) return;
      const pct=Math.round(s2.value/total*100);
      g+='<path class="mk" d="'+this.barPath(x,y,w,bh, (i===0||last)?4:0,'right')+'" fill="'+s2.fill+'" '+
        'data-t="'+esc(s2.name)+'|'+esc(Pay.money(s2.value))+'|'+pct+'% of the total"/>';
      const txt=pct+'%';
      if(w > 42) g+='<text x="'+(x+w/2)+'" y="'+(y+bh/2+4)+'" text-anchor="middle" '+
        'style="font-size:12px;font-weight:700;fill:'+(s2.light?'#0b0b0b':'#ffffff')+'">'+txt+'</text>';
      x+=w+(last?0:2);
    });
    /* uniform scaling — stretching the bar would stretch the percentages inside it */
    return '<div class="viz"><svg viewBox="0 0 '+W+' '+H+'" style="max-width:'+W+'px" '+
      'role="img" aria-label="'+esc(opts.aria||'')+'" data-viz="'+id+'">'+g+'</svg></div>';
  },
  wire(){
    $$('.viz [data-t]').forEach(el=>{
      el.addEventListener('mousemove', ev=>{
        const p=el.dataset.t.split('|');
        VIZ.tip('<b>'+p[0]+'</b>'+(p[1]?'<br>'+p[1]:'')+(p[2]?'<br>'+p[2]:''), ev);
      });
      el.addEventListener('mouseleave', ()=>VIZ.tip(null));
    });
  }
};
